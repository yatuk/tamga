<!doctype html>
<!--
  The structure the chatgpt adapter assumes. It is NOT a copy of chatgpt.com:
  a form holding a ProseMirror contenteditable div with no id, and the form's
  one submit button, named only by a translated aria-label. That much was
  read from the live page on 2026-10-11 (Turkish interface).

  The attach and voice buttons are here as negatives: neither the adapter nor
  the generic fallback may take one for the send button. Their labels, types
  and data-testid values are assumed. Written 2026-10-11.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fixture: the structure assumed for chatgpt.com</title>
  </head>
  <body>
    <main>
      <p data-fixture="log"></p>
      <form>
        <button type="button" aria-label="Dosya ekle" data-testid="composer-plus-btn" data-fixture="attach"><span>+</span></button>
        <div class="ProseMirror" contenteditable="true" role="textbox" aria-label="ChatGPT'ye sor" data-fixture="composer"><p>Hello</p><p>second line</p></div>
        <button type="button" aria-label="Sesli modu kullan" data-testid="composer-speech-button" data-fixture="voice"><span>Voice</span></button>
        <button type="submit" aria-label="Gönder" data-fixture="send"><span data-fixture="send-icon">Send</span></button>
      </form>
    </main>
    <script type="module">
      import { attachFakeSite } from './fake-site.js';
      attachFakeSite(document, { composer: '[data-fixture="composer"]', send: '[data-fixture="send"]' });
    </script>
  </body>
</html>
