<!doctype html>
<!--
  The structure the claude adapter assumes. It is NOT a copy of claude.ai and
  was not checked against it: a ProseMirror editor (a contenteditable div of
  paragraphs) inside a fieldset, and a send button named by aria-label that
  is not a submit button. Written 2026-10-11.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fixture: the structure assumed for claude.ai</title>
  </head>
  <body>
    <main>
      <p data-fixture="log"></p>
      <fieldset>
        <div class="tiptap ProseMirror" contenteditable="true" role="textbox" aria-label="Write your prompt to Claude" data-testid="chat-input" data-fixture="composer"><p>Hello</p><p>second line</p></div>
        <button type="button" aria-label="Send message" data-testid="chat-input-send" data-fixture="send"><span data-fixture="send-icon">Send</span></button>
      </fieldset>
    </main>
    <script type="module">
      import { attachFakeSite } from './fake-site.js';
      attachFakeSite(document, { composer: '[data-fixture="composer"]', send: '[data-fixture="send"]' });
    </script>
  </body>
</html>
