<!doctype html>
<!--
  The structure the deepseek adapter assumes. It is NOT a copy of
  chat.deepseek.com and was not checked against it (the site asks to sign in
  first): a textarea with the id chat-input, in no form, and a send button
  named by an English aria-label, as the open-source projects named in
  src/content/adapters/deepseek.js describe it. The file input is assumed.
  Written 2026-10-18.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fixture: the structure assumed for chat.deepseek.com</title>
  </head>
  <body>
    <main>
      <p data-fixture="log"></p>
      <div class="chat-input-area">
        <textarea id="chat-input" placeholder="Message DeepSeek" data-fixture="composer">Hello
second line</textarea>
        <input type="file" multiple hidden data-fixture="file">
        <button type="button" aria-label="Send message" data-fixture="send"><span data-fixture="send-icon">Send</span></button>
      </div>
    </main>
    <script type="module">
      import { attachFakeSite } from './fake-site.js';
      attachFakeSite(document, { composer: '[data-fixture="composer"]', send: '[data-fixture="send"]' });
    </script>
  </body>
</html>
