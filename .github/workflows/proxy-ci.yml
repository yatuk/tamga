name: Security (govulncheck + SBOM)

on:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - "deploy/migrations/**"
      - "deploy/e2e/**"
      - "scripts/verify-bin-data.sh"
      - ".github/workflows/proxy-ci.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC
  workflow_dispatch:

defaults:
  run:
    working-directory: proxy

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: proxy/go.mod
          cache: true
          cache-dependency-path: proxy/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  gosec:
    name: Go Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gosec
        uses: securego/gosec@master
        with:
          args: "-quiet -exclude-dir=scripts ./proxy/..."

  go-test:
    name: Go Test (race + E2E)
    # Not on pull requests or pushes, by the owner's decision (2026-10-11): it
    # takes about ten minutes. It runs on the weekly schedule or when started
    # by hand, and the release workflow runs the same tests before a release.
    # proxy-go-fast.yml runs go vet and the tests without -race on every pull
    # request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: proxy/go.mod
          cache: true
          cache-dependency-path: proxy/go.sum
      - name: E2E integration tests (full-stack, mock upstream)
        run: go test -race -count=1 -run "TestE2E_" ./internal/proxy/
      - name: Test all packages
        # The store's Postgres tests start their own container; without this
        # flag most of them skip and a schema bug goes unseen.
        env:
          TAMGA_INTEGRATION_DB: "1"
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: proxy/coverage.out

  verify-bin-data:
    name: Verify BIN Dataset Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check BIN SHA256
        # The script and its default CSV path are relative to the repo root,
        # not to proxy/ (this workflow's default working directory).
        working-directory: ${{ github.workspace }}
        run: bash scripts/verify-bin-data.sh

  fuzz:
    name: Fuzz (15 min)
    # Too slow for every push: runs on the weekly schedule or when started by hand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: proxy/go.mod
          cache: true
          cache-dependency-path: proxy/go.sum
      - name: Fuzz scanners
        run: |
          go test -fuzz=FuzzValidLuhn -fuzztime=5m ./internal/scanner/
          go test -fuzz=FuzzValidTCKN -fuzztime=5m ./internal/scanner/
          go test -fuzz=FuzzMaskPAN -fuzztime=5m ./internal/scanner/

  benchmark-regression:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: proxy/go.mod
          cache: true
          cache-dependency-path: proxy/go.sum
      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=3 ./internal/scanner/ | tee bench_output.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: proxy/bench_output.txt

  litellm-e2e:
    name: LiteLLM bridge (end to end)
    # A LiteLLM container, pinned by tag in deploy/e2e/litellm, calls the
    # proxy built from this commit as its guardrail, in front of a fake model.
    # The compose network is internal: nothing in it can reach a provider.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: LiteLLM calls Tamga as a guardrail
        # The script and its compose file are relative to the repo root, not
        # to proxy/ (this workflow's default working directory).
        working-directory: ${{ github.workspace }}
        run: bash deploy/e2e/litellm/run.sh
