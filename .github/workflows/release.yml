name: Release

# Builds, signs and publishes a release from a version tag.
#
#   git tag v0.9.0 && git push origin v0.9.0     a release
#   Actions > Release > Run workflow             a dry run
#
# A dry run builds everything a release builds (binaries, images, chart,
# extension archive, SDK packages, SBOMs, checksums) and keeps the files as
# a workflow artifact. It pushes no image, creates no attestation and no
# release, and no job of it can ask for a signing certificate. It signs
# every release file with a throwaway key made in the job, with the
# transparency log off, and verifies those signatures: the same commands as
# a release, with nothing sent to Sigstore. Image signing is skipped, since
# a local image has no registry digest to sign.
#
# The licence gate (.github/workflows/licence-gate.yml) runs beside the
# builds and writes the checked dependency SBOMs. Nothing is signed or
# published unless it passes; a dry run goes on to its local signing when it
# fails, so both results show in one run, and the run fails.
#
# What a release publishes, and how to check it, is in
# docs/verifying-a-release.md. Keep that file and this one in step: the
# certificate identity a verifier requires is this workflow's path.
#
# Signing is Sigstore keyless: the signing certificate is issued to this
# workflow run's GitHub OIDC identity. There is no signing key in the
# repository or its secrets, and the only token used is GITHUB_TOKEN.
#
# Every action is pinned to a commit. The SHA of each was read from the
# action's own repository (git ls-remote of the release tag) on 2026-10-11.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

# Nothing by default. Each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── What is being built, and whether it will be published ─────────────────
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      semver: ${{ steps.plan.outputs.semver }}
      revision: ${{ steps.plan.outputs.revision }}
      epoch: ${{ steps.plan.outputs.epoch }}
      created: ${{ steps.plan.outputs.created }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      image_base: ${{ steps.plan.outputs.image_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide version and mode
        id: plan
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.]*)?$'; then
              echo "::error::tag '$version' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE"
              exit 1
            fi
            publish=true
          else
            # Started by hand: a dry run, whatever ref it was started on.
            version="v0.0.0-dryrun.${GITHUB_SHA:0:12}"
            publish=false
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          epoch="$(git log -1 --format=%ct "$GITHUB_SHA")"
          {
            echo "version=$version"
            echo "semver=${version#v}"
            echo "revision=$GITHUB_SHA"
            echo "epoch=$epoch"
            echo "created=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
            # A registry path is lower case.
            echo "image_base=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, commit $GITHUB_SHA, publish=$publish" >> "$GITHUB_STEP_SUMMARY"

      - name: A release tag must be on main
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit $GITHUB_SHA is not on main; a release is built from main only"
            exit 1
          fi

      - name: The changelog must have a section for the tag
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          heading="$(grep -m1 -E "^## ${VERSION//./\\.}([^0-9A-Za-z.-]|$)" CHANGELOG.md || true)"
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi
          case "$heading" in
            *unreleased*) echo "::error::CHANGELOG.md still says: $heading"; exit 1 ;;
          esac

  # ── The gates a commit passes on main, run again on what is released ──────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: proxy/go.mod
          # A release reads no cache an earlier run wrote.
          cache: false
      - name: go vet
        working-directory: proxy
        run: go vet ./...
      - name: Go tests
        working-directory: proxy
        env:
          # As in proxy-ci.yml: without it the store's Postgres tests skip.
          TAMGA_INTEGRATION_DB: "1"
        run: go test -race -count=1 ./...
      - name: BIN dataset integrity
        run: bash scripts/verify-bin-data.sh
      - name: Extension tests
        working-directory: extension
        run: node --test

  licences:
    name: Dependency licences and SBOMs
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/licence-gate.yml
    with:
      artifact_version: ${{ needs.plan.outputs.version }}

  # ── Binaries ──────────────────────────────────────────────────────────────
  binaries:
    name: Binaries
    needs: [plan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REVISION: ${{ needs.plan.outputs.revision }}
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The exact toolchain go.mod names: the same source and the same
          # toolchain give the same bytes.
          go-version-file: proxy/go.mod
          cache: false
      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Build
        working-directory: proxy
        run: |
          set -euo pipefail
          # Everything is written outside the checkout: an untracked file in
          # the tree would make the Go tool stamp vcs.modified=true.
          out="$RUNNER_TEMP/dist"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$out" "$stage"
          pkg=github.com/yatuk/tamga/internal/buildinfo
          ldflags="-s -w -buildid= -X ${pkg}.Version=${VERSION} -X ${pkg}.Revision=${REVISION}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            name="tamga_${VERSION}_${os}_${arch}"
            mkdir -p "$stage/$name"
            for cmd in tamga scanner-service; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOFLAGS=-mod=readonly \
                go build -trimpath -buildvcs=true -ldflags "$ldflags" \
                -o "$stage/$name/${cmd}${ext}" "./cmd/${cmd}"
            done
            cp ../LICENSE ../NOTICE ../THIRD_PARTY_LICENSES.md tamga-policy.yaml "$stage/$name/"
            chmod 0755 "$stage/$name"/tamga* "$stage/$name"/scanner-service*
            chmod 0644 "$stage/$name"/LICENSE "$stage/$name"/NOTICE "$stage/$name"/*.md "$stage/$name"/*.yaml
            # Fixed order, times and owners, and no name or time in the gzip
            # header, so the archive is the same bytes on a rebuild.
            tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
              -C "$stage" -cf - "$name" | gzip -n -9 > "$out/$name.tar.gz"
          done

      - name: The binaries say what they were built from
        run: |
          set -euo pipefail
          info="$(go version -m "$RUNNER_TEMP/stage/tamga_${VERSION}_linux_amd64/tamga")"
          echo "$info" | grep -E '^\s+build\s' || true
          echo "$info" | grep -q "vcs.revision=${REVISION}" || { echo "::error::binary does not carry the commit"; exit 1; }
          echo "$info" | grep -q "vcs.modified=false" || { echo "::error::binary was built from a modified tree"; exit 1; }
          echo "$info" | grep -q -- "-trimpath=true" || { echo "::error::binary was built without -trimpath"; exit 1; }

      - name: SBOM for each archive (SPDX)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          for dir in "$RUNNER_TEMP"/stage/tamga_*; do
            name="$(basename "$dir")"
            "$SYFT" scan "dir:$dir" --source-name "$name" --source-version "$VERSION" \
              -o "spdx-json=$RUNNER_TEMP/dist/$name.spdx.json"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-binaries
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 14

  # ── Helm chart, extension archive, SDK packages ───────────────────────────
  packages:
    name: Chart, extension, SDK packages
    needs: [plan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SEMVER: ${{ needs.plan.outputs.semver }}
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Helm chart
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          # The chart refuses to render without an admin key.
          helm lint deploy/helm/tamga-proxy --set secrets.adminKey=lint-only-not-a-key
          # The chart keeps its own version; appVersion is the release.
          helm package deploy/helm/tamga-proxy --app-version "$SEMVER" --destination "$RUNNER_TEMP/dist"

      - name: Browser extension archive
        working-directory: extension
        run: |
          set -euo pipefail
          # The extension has no build step: the archive is the committed
          # files, with the commit's time on them. It is not signed for a
          # browser and is in no store.
          git archive --format=zip --prefix="tamga-extension-${VERSION}/" \
            -o "$RUNNER_TEMP/dist/tamga-extension-${VERSION}.zip" "$GITHUB_SHA" .

      - name: Python SDK (wheel and sdist)
        run: |
          set -euo pipefail
          python -m pip install build==1.2.2
          python -m build --outdir "$RUNNER_TEMP/dist" sdk/python

      - name: TypeScript SDK (npm tarball)
        working-directory: sdk/typescript/tamga-client
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-packages
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 14

  # ── Container images: built here, with no signing identity ────────────────
  # This job runs the Dockerfiles, and so code from npm, PyPI and the base
  # images. It has no id-token permission: nothing a build step runs can ask
  # for a signing certificate. The job after it signs what was pushed.
  images:
    name: Image (${{ matrix.name }})
    needs: [plan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # pushes to GHCR; a dry run pushes nothing
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: proxy
            suffix: ""
            context: proxy
            file: proxy/Dockerfile
          - name: scanner-service
            suffix: "-scanner-service"
            context: proxy
            file: proxy/cmd/scanner-service/Dockerfile
          - name: analyzer
            suffix: "-analyzer"
            context: analyzer
            file: analyzer/Dockerfile
          - name: classifier
            suffix: "-classifier"
            context: classifier
            file: classifier/Dockerfile
          - name: dashboard
            suffix: "-dashboard"
            context: dashboard
            file: dashboard/Dockerfile
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      IMAGE: ${{ needs.plan.outputs.image_base }}${{ matrix.suffix }}
      LOCAL_TAG: tamga-dryrun/${{ matrix.name }}:dryrun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Log in to GHCR
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only: the scanner-service image downloads an amd64
      # health probe, and no image has been built or run on arm64.
      #
      # BuildKit's own provenance and SBOM attestations are off. They are
      # unsigned documents inside the image index; the signed ones are made
      # by the next job, and with them off the digest pushed is the image
      # manifest itself.
      - name: Build (dry run, loaded into the local daemon, not pushed)
        if: needs.plan.outputs.publish != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.LOCAL_TAG }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
            REVISION=${{ needs.plan.outputs.revision }}
          labels: |
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.revision }}
            org.opencontainers.image.created=${{ needs.plan.outputs.created }}

      # Pushed by digest and under no tag. The version tag is added by the
      # signing job, after the signature is there and has been verified, so
      # a version tag never points at an unsigned image.
      - name: Build and push by digest
        id: push
        if: needs.plan.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
            REVISION=${{ needs.plan.outputs.revision }}
          labels: |
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.revision }}
            org.opencontainers.image.created=${{ needs.plan.outputs.created }}

      - name: SBOM of the image (SPDX)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          DIGEST: ${{ steps.push.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/image"
          mkdir -p "$out"
          sbom="$out/tamga-image-${NAME}_${VERSION}.spdx.json"
          if [ "$PUBLISH" = "true" ]; then
            case "$DIGEST" in
              sha256:*) ;;
              *) echo "::error::the push returned no digest"; exit 1 ;;
            esac
            # The object in the registry, by digest: what a user pulls.
            "$SYFT" scan "registry:${IMAGE}@${DIGEST}" -o "spdx-json=$sbom"
            echo "${IMAGE}@${DIGEST}" > "$out/${NAME}.image-ref"
          else
            "$SYFT" scan "docker:${LOCAL_TAG}" -o "spdx-json=$sbom"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          retention-days: 14

  # ── Sign the images, attest them, then give them their version tag ────────
  sign-images:
    name: Sign image (${{ matrix.name }})
    needs: [plan, images, licences]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write # signatures and attestations are stored beside the image
      id-token: write # the Sigstore certificate is issued to this job's OIDC token
      attestations: write # the provenance attestation is recorded with GitHub
    strategy:
      fail-fast: false
      matrix:
        name: [proxy, scanner-service, analyzer, classifier, dashboard]
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      NAME: ${{ matrix.name }}
      # What a verifier requires: this workflow, at this tag.
      CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
      CERT_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.name }}
          path: image

      - name: Read the pushed image reference
        id: ref
        run: |
          set -euo pipefail
          ref="$(cat "image/${NAME}.image-ref")"
          case "$ref" in
            ghcr.io/*@sha256:*) ;;
            *) echo "::error::unexpected image reference '$ref'"; exit 1 ;;
          esac
          {
            echo "ref=$ref"
            echo "image=${ref%@*}"
            echo "digest=${ref#*@}"
          } >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (installs cosign v3.0.6)
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the image (cosign, keyless)
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: cosign sign --yes "$REF"

      - name: Attach the SBOM as a signed attestation
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson \
            --predicate "image/tamga-image-${NAME}_${VERSION}.spdx.json" "$REF"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.ref.outputs.digest }}
          push-to-registry: true
          # A storage record needs a further permission and adds nothing a
          # verifier uses.
          create-storage-record: false

      - name: Verify what was just signed, as a user would
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          cosign verify "$REF" \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" > /dev/null
          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" > /dev/null

      - name: Tag the signed digest with the version
        env:
          REF: ${{ steps.ref.outputs.ref }}
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.ref.outputs.digest }}
        run: |
          set -euo pipefail
          # --prefer-index=false: copy the manifest as it is. The default
          # wraps a single image in a new index, which has another digest
          # and no signature.
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:${VERSION}" "$REF"
          # The tag must name the digest that was signed, not a new object.
          tagged="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::${IMAGE}:${VERSION} is $tagged, but $DIGEST was signed"
            exit 1
          fi
          echo "\`${IMAGE}:${VERSION}\` is \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  # ── Put the release files together and write the checksums ────────────────
  collect:
    name: Checksums
    needs: [plan, binaries, packages, images, licences]
    # Every build must have passed. The licence gate must have passed for a
    # release; a dry run carries on after a failed gate (the run still fails)
    # so that the signing below is tried too.
    if: >-
      !cancelled()
      && needs.binaries.result == 'success'
      && needs.packages.result == 'success'
      && needs.images.result == 'success'
      && (needs.licences.result == 'success'
          || (needs.licences.result == 'failure' && needs.plan.outputs.publish != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-sboms
          path: dist
      - name: Image digests and checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # One line per pushed image: name@sha256:digest. Empty on a dry run.
          refs="image-digests_${VERSION}.txt"
          : > "$refs"
          for f in *.image-ref; do
            [ -e "$f" ] || continue
            cat "$f" >> "$refs"
            rm "$f"
          done
          sort -o "$refs" "$refs"
          [ -s "$refs" ] || echo "# dry run: no image was pushed" > "$refs"
          # Checksums of every release file, in a fixed order.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          {
            echo '### Release files'
            echo '```text'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ── Sign every release file (keyless), attest them, create the release ────
  sign-files:
    name: Sign release files
    needs: [plan, collect, licences]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the Sigstore certificate is issued to this job's OIDC token
    env:
      CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
      CERT_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (installs cosign v3.0.6)

      - name: The checksums must still match the files
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      # SHA256SUMS and each file it lists get a bundle `<file>.sigstore.json`.
      - name: Sign and verify every file (cosign, keyless)
        working-directory: dist
        run: |
          set -euo pipefail
          files=(SHA256SUMS)
          while read -r _ file; do files+=("${file#\*}"); done < SHA256SUMS
          for file in "${files[@]}"; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
            cosign verify-blob "$file" --bundle "${file}.sigstore.json" \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$CERT_ISSUER" > /dev/null
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-files
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ── Dry run: the same signing and verification, with nothing sent out ─────
  # No id-token permission: this job cannot get a Sigstore certificate. The
  # key is made here and thrown away with the runner. --use-signing-config
  # =false and --tlog-upload=false keep cosign from contacting Rekor or a
  # timestamp authority, and the step fails if a bundle holds a log entry.
  sign-files-dry-run:
    name: Sign release files (dry run, local key)
    needs: [plan, collect]
    # Not the default success(): it would skip this job after a failed licence
    # gate, which collect lets a dry run carry on from.
    if: >-
      !cancelled()
      && needs.collect.result == 'success'
      && needs.plan.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (installs cosign v3.0.6)

      - name: The checksums must still match the files
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Sign and verify every file (cosign, throwaway key, no log)
        working-directory: dist
        env:
          COSIGN_PASSWORD: dry-run-only-not-a-secret
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/cosign-dry-run"
          mkdir -p "$keys"
          (cd "$keys" && cosign generate-key-pair)
          files=(SHA256SUMS)
          while read -r _ file; do files+=("${file#\*}"); done < SHA256SUMS
          for file in "${files[@]}"; do
            bundle="${file}.sigstore.json"
            cosign sign-blob --yes --key "$keys/cosign.key" \
              --use-signing-config=false --tlog-upload=false \
              --bundle "$bundle" "$file"
            entries="$(jq '.verificationMaterial.tlogEntries // [] | length' "$bundle")"
            if [ "$entries" != "0" ]; then
              echo "::error::$bundle has a transparency log entry; a dry run must not write one"
              exit 1
            fi
            cosign verify-blob "$file" --bundle "$bundle" \
              --key "$keys/cosign.pub" --insecure-ignore-tlog=true > /dev/null
          done
          echo "Dry run: ${#files[@]} files signed with a throwaway key and verified; nothing was uploaded." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-signed-release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the release
    needs: [plan, licences, sign-files, sign-images]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creates the release and uploads its files
      id-token: write # signs the provenance attestation through GitHub OIDC
      attestations: write # records the provenance attestation with GitHub
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-files
          path: dist

      - name: Attest build provenance of every release file (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create the release (as a draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            echo "Changes: see the \`${VERSION}\` section of [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/CHANGELOG.md)."
            echo
            echo "Every release payload is listed in \`SHA256SUMS\`; it and each payload have a \`.sigstore.json\` signature bundle. The container images are named, by digest, in \`image-digests_${VERSION}.txt\`. How to check the signatures, the provenance and the SBOMs: [docs/verifying-a-release.md](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/docs/verifying-a-release.md)."
          } > "$RUNNER_TEMP/notes.md"
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          # A draft: the maintainer reads it and publishes it. The tag, the
          # signatures and the images exist from this point on either way.
          gh release create "$VERSION" "${flags[@]}" dist/*
