name: Classifier tests

on:
  push:
    branches: [main]
    paths:
      - "classifier/**"
      - "proto/classifier/**"
      - ".github/workflows/classifier-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "classifier/**"
      - "proto/classifier/**"
      - ".github/workflows/classifier-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: classifier

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: classifier/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pytest
      # The tests use a stand-in for the model; no model is downloaded.
      - name: Test
        run: python -m pytest -q tests
