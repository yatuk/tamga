name: Integration Smoke Test (Docker)

on:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - "deploy/**"
      - "scripts/smoke-test.sh"
      - ".github/workflows/integration-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "proxy/**"
      - "deploy/**"
      - "scripts/smoke-test.sh"
      - ".github/workflows/integration-smoke.yml"
  workflow_dispatch:

jobs:
  docker-smoke:
    name: Proxy-Only Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tamga
          POSTGRES_PASSWORD: smoke-pg-pass
          POSTGRES_DB: tamga
        options: >-
          --health-cmd "pg_isready -U tamga"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build proxy image
        run: docker build -t tamga-proxy ./proxy

      # The service database starts empty. Every migration is applied in
      # order, the way deploy/README.md says to for a new database, so a
      # migration that does not apply fails here.
      - name: Apply migrations
        run: |
          for f in deploy/migrations/*.up.sql; do
            echo "applying $f"
            docker exec -i "${{ job.services.postgres.id }}" \
              psql -U tamga -d tamga -v ON_ERROR_STOP=1 -q < "$f"
          done

      - name: Start proxy (mock upstream, no analyzer)
        run: |
          docker run -d --name tamga-proxy \
            --network host \
            -e TAMGA_PROXY_PORT=8443 \
            -e TAMGA_ADMIN_KEY=smoke-test-admin-key \
            -e TAMGA_MOCK_UPSTREAM=true \
            -e TAMGA_DB_URL="postgresql://tamga:smoke-pg-pass@localhost:5432/tamga" \
            -e REDIS_URL="redis://localhost:6379" \
            -e TAMGA_ANALYZER_ADDR="" \
            -e TAMGA_RETENTION_ENABLED=true \
            -v ${{ github.workspace }}/proxy/tamga-policy.yaml:/app/tamga-policy.yaml:ro \
            tamga-proxy

      - name: Wait for proxy
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8443/health > /dev/null 2>&1; then
              echo "Proxy ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Proxy failed to start"
          docker logs tamga-proxy
          exit 1

      - name: Health check
        run: |
          curl -fsS http://localhost:8443/health | grep '"status":"ok"'
          # The detail needs the admin key; without it the body is only up or down.
          curl -fsS -H "X-Tamga-Admin-Key: smoke-test-admin-key" http://localhost:8443/api/v1/health/detailed \
            | tee /dev/stderr \
            | jq -e '.status == "ok" and .database == "connected" and .redis == "connected" and .scanner_count > 0'

      - name: Clean request (PASS)
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8443/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer demo-key" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Merhaba"}]}')
          [ "$CODE" = "200" ] || { echo "Expected 200, got $CODE"; exit 1; }

      - name: Credit card BLOCK
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8443/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer demo-key" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Card 4532015112830366"}]}')
          [ "$CODE" = "403" ] || { echo "Expected 403, got $CODE"; exit 1; }

      - name: API auth check
        run: |
          # No key → 401
          NOAUTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8443/api/v1/stats)
          [ "$NOAUTH" = "401" ] || { echo "Expected 401, got $NOAUTH"; exit 1; }

          # With key → 200
          AUTH=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Tamga-Admin-Key: smoke-test-admin-key" http://localhost:8443/api/v1/stats)
          [ "$AUTH" = "200" ] || { echo "Expected 200, got $AUTH"; exit 1; }

      - name: Request log reaches the database
        run: |
          # Rows are written in batches; give the writer a moment.
          for i in $(seq 1 15); do
            ROWS=$(docker exec "${{ job.services.postgres.id }}" psql -U tamga -d tamga -At -c "SELECT count(*) FROM request_logs")
            [ "$ROWS" -ge 1 ] && { echo "request_logs has $ROWS rows"; exit 0; }
            sleep 2
          done
          echo "No row reached request_logs"; exit 1

      - name: Retention job ran on the migrated schema
        run: |
          # The job runs once at startup and writes one row per step; a step
          # that failed has the error as its message.
          Q() { docker exec "${{ job.services.postgres.id }}" psql -U tamga -d tamga -At -c "$1"; }
          for i in $(seq 1 15); do
            RAN=$(Q "SELECT count(*) FROM retention_run_log WHERE phase = 'purge_rows'")
            [ "$RAN" -ge 1 ] && break
            sleep 2
          done
          Q "SELECT phase, message FROM retention_run_log"
          BAD=$(Q "SELECT count(*) FROM retention_run_log WHERE message IS DISTINCT FROM 'ok'")
          [ "$BAD" = "0" ] && [ "$RAN" -ge 1 ] || { echo "retention: $RAN purge runs, $BAD failed steps"; exit 1; }

      - name: PDF report without an analyzer (503 with a body)
        run: |
          CODE=$(curl -s -o report.json -w "%{http_code}" -H "X-Tamga-Admin-Key: smoke-test-admin-key" "http://localhost:8443/api/v1/reports/owasp/pdf?range=7d")
          cat report.json
          [ "$CODE" = "503" ] || { echo "Expected 503, got $CODE"; exit 1; }
          jq -e '.code == "analyzer_unavailable" and (.error | length > 0)' report.json

      - name: Collect logs on failure
        if: failure()
        run: docker logs tamga-proxy
