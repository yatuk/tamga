name: Adversarial Regression Gate

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "proxy/**"
      - "analyzer/**"
      - "deploy/docker-compose.yml"
      - "tests/stress/**"
      - ".github/workflows/adversarial-gate.yml"
  # Also on direct pushes: a change that reaches main without a pull request
  # (local merge, hotfix) must not skip the gate.
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - "analyzer/**"
      - "deploy/docker-compose.yml"
      - "tests/stress/**"
      - ".github/workflows/adversarial-gate.yml"
  # Load tests are not part of the gate: a shared runner hosts the whole stack
  # and k6 on the same few cores, so latency there measures the runner, not
  # the change. They run locally (tests/stress/run_stress_suite.sh) or here on
  # request.
  workflow_dispatch:
    inputs:
      load:
        description: "Also run the k6 load tests (P95 gate on 100 RPS only)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: adversarial-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress-suite:
    name: Stress Suite (adversarial)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Docker and Compose are preinstalled on ubuntu-latest; no service
    # container is needed to use them.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: proxy/go.sum

      - name: Install k6
        if: github.event_name == 'workflow_dispatch' && inputs.load
        run: |
          if command -v k6 &>/dev/null; then
            echo "k6 already installed: $(k6 version)"
            exit 0
          fi
          # Pinned release binary. The apt route fetched the signing key into
          # root's keyring but pointed apt at a keyring file it never wrote,
          # so `apt-get update` rejected the repository.
          K6_VER="0.57.0"
          curl -sSfL "https://github.com/grafana/k6/releases/download/v${K6_VER}/k6-v${K6_VER}-linux-amd64.tar.gz" -o /tmp/k6.tar.gz
          sudo tar xzf /tmp/k6.tar.gz -C /usr/local/bin --strip-components=1 "k6-v${K6_VER}-linux-amd64/k6"
          k6 version

      - name: Build images
        run: |
          cd "$GITHUB_WORKSPACE"
          docker compose -f deploy/docker-compose.yml build --quiet

      - name: Run stress suite
        id: stress
        run: |
          chmod +x tests/stress/run_stress_suite.sh
          if [ "$RUN_LOAD" = "true" ]; then
            ./tests/stress/run_stress_suite.sh
          else
            ./tests/stress/run_stress_suite.sh --skip-load
          fi
        env:
          RUN_LOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.load }}
          TAMGA_HEALTH_TIMEOUT: "90"
          # The runner has no .env. Compose needs these to start the stack;
          # they are throwaway values for an ephemeral CI database.
          POSTGRES_PASSWORD: ci-only-postgres
          REDIS_PASSWORD: ci-only-redis
          TAMGA_ADMIN_KEY: ci-only-admin-key
          # Scan and enforce, but never forward test vectors to a provider.
          TAMGA_MOCK_UPSTREAM: "true"
          # Only used by a manual run with load tests: 100 RPS gates on P95,
          # the higher levels are reported as warning annotations.
          STRESS_LOAD_GATE_LEVELS: "100rps"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-results-${{ github.run_id }}
          path: tests/stress/results/
          retention-days: 30
          if-no-files-found: warn

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            // Find the latest results directory
            const resultsBase = "tests/stress/results";
            let latestDir = "";
            if (fs.existsSync(resultsBase)) {
              const dirs = fs.readdirSync(resultsBase)
                .filter(d => fs.statSync(path.join(resultsBase, d)).isDirectory())
                .sort()
                .reverse();
              if (dirs.length > 0) latestDir = path.join(resultsBase, dirs[0]);
            }

            let body = "## 🛡️ Adversarial Regression Gate\n\n";

            if (process.env.STRESS_EXIT_CODE === "0" || !process.env.STRESS_EXIT_CODE) {
              body += "**Status:** ✅ Passed — no regression detected\n\n";
            } else {
              body += "**Status:** ❌ Failed — regression detected\n\n";
            }

            body += `Results directory: \`${latestDir || "N/A"}\`\n`;
            body += `[Download artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;

            // Try to read adversarial summary
            const advFile = path.join(latestDir, "adversarial_results.json");
            if (fs.existsSync(advFile)) {
              const adv = JSON.parse(fs.readFileSync(advFile, "utf8"));
              body += "\n### Adversarial Bypass Summary\n";
              body += "| Category | Detected | Bypassed |\n";
              body += "|----------|----------|----------|\n";
              for (const [cat, data] of Object.entries(adv)) {
                if (cat === "total_bypassed") continue;
                body += `| ${cat} | ${data.detected} | ${data.bypassed} |\n`;
              }
              body += `| **TOTAL** | — | **${adv.total_bypassed}** |\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
        env:
          STRESS_EXIT_CODE: ${{ steps.stress.outcome == 'success' && '0' || '1' }}
