{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tamga-proxy.fullname" . }}
  labels: {{- include "tamga-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  TAMGA_ADMIN_KEY: {{ required "set secrets.adminKey, or set secrets.existingSecret to the name of a Secret that holds the key TAMGA_ADMIN_KEY" .Values.secrets.adminKey | quote }}
  {{- with .Values.secrets.databaseUrl }}
  TAMGA_DB_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.redisUrl }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
{{- end }}
