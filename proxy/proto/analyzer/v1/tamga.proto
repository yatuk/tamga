// Tamga Analyzer — gRPC API definition for deep semantic NLP scanning.
//
// The Go proxy calls the Python analyzer over a persistent, multiplexed gRPC
// connection. All static regex-based scanning (PII, secrets, injection patterns,
// jailbreak keywords, content moderation) runs inline in Go at <1ms latency.
// This service is strictly reserved for ML/NLP analysis:
//   - Presidio spaCy NER — contextual entity recognition (PERSON, ORG, GPE, LOC)
//   - Claude Haiku judge — semantic prompt injection classification

syntax = "proto3";

package proto.analyzer.v1;

option go_package = "github.com/yatuk/tamga/proto/analyzer/v1;analyzerv1";

// ── Service ─────────────────────────────────────────────────────────────────

service AnalyzerService {
  // Analyze runs deep semantic analysis on content that has already passed
  // the Go proxy's static regex scanners. Returns only NLP/ML findings.
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);

  // Extract returns the text of an attached file (PDF, DOCX, XLSX, PPTX,
  // and images or scanned PDFs by OCR when asked and installed), so that
  // the proxy can scan it like any other text. It never fails the call for
  // a file it cannot read: the status says why, and no part of the file is
  // in an error message.
  rpc Extract(ExtractRequest) returns (ExtractResponse);

  // HealthCheck returns service health status (standard gRPC health probe).
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ── Messages ────────────────────────────────────────────────────────────────

message AnalyzeRequest {
  // Unique request identifier propagated from the proxy (UUID).
  string request_id = 1;

  // The text content to analyze (prompt or response body).
  string content = 2;

  // Which scanner types to run: "pii", "injection".
  // The Go proxy selects these based on input risk score.
  repeated string scan_types = 3;

  // LLM provider and model (e.g. "openai", "gpt-4o-mini").
  string provider = 4;
  string model = 5;

  // Opaque metadata forwarded from the proxy (org_id, action, endpoint,
  // direction, input_risk, etc.).
  map<string, string> metadata = 6;

  // Set by the Go proxy; text has already passed static regex scan.
  bool pre_scanned = 7;
}

message AnalyzeResponse {
  string request_id = 1;

  // Aggregated findings from all scanners.
  repeated Finding findings = 2;

  // End-to-end wall-clock duration in milliseconds.
  double duration_ms = 3;

  // Per-scanner results for observability (duration, count per scanner).
  repeated ScannerResult scanner_results = 4;
}

message Finding {
  // Finding type: "pii", "injection".
  string type = 1;

  // Entity/technique category (e.g. "PERSON", "ignore_prev").
  string category = 2;

  // Severity level: "critical", "high", "medium", "low".
  string severity = 3;

  // Truncated match excerpt for logging/audit (≤200 chars).
  string match = 4;

  // Confidence score 0.0–1.0.
  double confidence = 5;
}

message ScannerResult {
  // Scanner name (e.g. "pii_deep", "injection_llm").
  string scanner = 1;

  // Findings produced by this scanner.
  repeated Finding findings = 2;

  // Scanner execution time in milliseconds.
  double duration_ms = 3;
}

message ExtractRequest {
  // Unique request identifier propagated from the proxy (UUID).
  string request_id = 1;

  // The file as it was attached, decoded from base64.
  bytes data = 2;

  // What the request says the file is. Neither is trusted: the file's own
  // signature decides how it is read.
  string mime_type = 3;
  string filename = 4;

  ExtractLimits limits = 5;

  // Read images, and PDF pages without a text layer, by OCR. Without it
  // such a file answers "ocr_unavailable".
  bool ocr = 6;

  // OCR language hint (e.g. "tur+eng"); empty for the engine's default.
  string ocr_lang = 7;
}

message ExtractLimits {
  // The largest file read, in bytes.
  int64 max_bytes = 1;
  // The most pages, sheets or slides read; the rest is left out and the
  // answer is marked truncated.
  uint32 max_pages = 2;
  // The most characters of text returned, over all parts.
  uint32 max_chars = 3;
  // How long the analyzer may take.
  uint32 timeout_ms = 4;
}

message ExtractResponse {
  string request_id = 1;

  // "ok" when text was read, or why the file could not be read:
  // "encrypted", "unsupported_type", "too_large", "extract_failed",
  // "ocr_unavailable".
  string status = 2;

  // The text, one part per page, sheet or slide (or one for an image).
  repeated ExtractedPart parts = 3;

  // A limit (pages, characters) cut the text short.
  bool truncated = 4;

  // What the file was read as: "pdf", "docx", "xlsx", "pptx", "image", …
  string detected_type = 5;

  double duration_ms = 6;
}

message ExtractedPart {
  // "page", "sheet", "slide" or "image".
  string kind = 1;
  // 1-based position of the part in the file.
  uint32 index = 2;
  // The sheet's name; empty for the other kinds.
  string name = 3;
  string text = 4;
  // The text was read by OCR.
  bool ocr = 5;
}

message HealthCheckRequest {
  // Intentionally empty — standard gRPC health probe.
}

message HealthCheckResponse {
  // "ok" when healthy.
  string status = 1;

  // Service identifier: "tamga-analyzer".
  string service = 2;
}
