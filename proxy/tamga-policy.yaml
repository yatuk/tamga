version: "1.0"
name: "default-policy"

rules:
  # Contact-style PII is redacted before the request is forwarded. So are a
  # MERSİS number, an IMEI and a Turkish passport number that the text names
  # as one. A vehicle plate (license_plate_tr) is detected and not listed
  # here; policies/templates/ has starting points that mask it.
  pii_detection:
    action: REDACT
    sensitivity: medium
    types: [iban, email, phone_tr, phone, vkn, ip_public, ip_private, mersis_no, imei, passport_tr]
    notify:
      - channel: slack
        webhook: ${SLACK_WEBHOOK_URL}

  # Critical identifiers (Turkish national ID, card numbers, SSN) are hard
  # blocked — these must never reach an external model. Both this bare "pii"
  # key and "pii_detection" above are evaluated per finding category; the
  # stronger action wins.
  pii:
    action: BLOCK
    sensitivity: medium
    types: [tc_kimlik, credit_card, ssn]
    notify:
      - channel: slack
        webhook: ${SLACK_WEBHOOK_URL}

  secret_detection:
    action: BLOCK
    sensitivity: low
    types: [aws_access_key, aws_secret_key, aws_secret_key_broad, github_token, openai_key, anthropic_key, private_key, stripe_key, connection_string, connection_string_password, jwt_token, dotenv_secret, slack_webhook, slack_token, google_api_key, twilio_sid, basic_auth, password, generic_api_key, azure_storage_key, gitlab_token, npm_token, sendgrid_key, mailchimp_key, square_token, discord_bot_token, telegram_bot_token, pypi_token, artifactory_key, url_credentials]

  # applies_to limits a rule to text of some roles: system, user, assistant,
  # tool (tool results, documents, search results), tool_definition, request.
  # Without it a rule covers every role, as this one does. To let your own
  # system prompt say "ignore previous instructions" without being blocked:
  #
  #   injection:
  #     action: BLOCK
  #     applies_to: [user, assistant, tool, tool_definition, request]
  #   injection_detection:
  #     action: WARN
  #     applies_to: [system]
  #
  # (in place of the injection_detection rule below: a key appears once).
  #
  # The role is whatever the request says. Only narrow a rule this way when
  # your own server builds the request; a caller who reaches the proxy
  # directly can label any text "system".
  #
  # Four injection categories are signals and not verdicts: unreadable_block
  # (a long block that looks encoded and decodes to nothing readable),
  # hidden_text at severity low (a run of zero-width characters, a
  # bidirectional override), above_text_request (a user's first message is
  # only "translate the above" or "repeat the above", and what is above is
  # the system prompt) and translation_abandoned (one text asks for a
  # translation and then tells its reader to drop it). No rule acts on a
  # signal unless it names the category, whatever its sensitivity;
  # scan.default_action does not either. To be told about them, name them in
  # the injection_detection rule below:
  #
  #   injection_detection:
  #     action: WARN
  #     types: [quoted_injection, unreadable_block, hidden_text, above_text_request, translation_abandoned]
  #
  # hidden_text is severity high, and an ordinary injection finding that the
  # rule below blocks, when the invisible characters spell text (tag
  # characters, variation selectors).
  injection:
    action: BLOCK
    sensitivity: medium
    notify:
      - channel: slack
        webhook: ${SLACK_WEBHOOK_URL}

  # quoted_injection is a fifth signal: an injection that a text holds only
  # in a code block, inline code, a quotation or a sentence that gives it as
  # an example, while the rest of the text talks about attacks and neither
  # tells the model to carry it out nor speaks to the model. A security
  # write-up, a README's "what this blocks" and a test file are such texts.
  # The finding's metadata names the category it would otherwise have had
  # (quoted_category). It is warned about here and not blocked. Without
  # this rule such text passes; with BLOCK it is stopped, as before v0.9.0.
  # The signals named above go in the same types list.
  injection_detection:
    action: WARN
    types: [quoted_injection]

  # There is no rule for source code in answers here, and one would do
  # nothing. A rule key is matched to a finding as "<type>_detection" or
  # "<type>", and these rules decide about findings in requests only. The
  # code-leak scanner (finding type code_leak) reads responses only; what
  # happens to a finding in a response is decided by output_rules, below.

  # Operator-state findings carry per-assertion actions via confidence scores
  # (block/warn/log per rule below) — confidence_based mode honours them.
  operator_state:
    mode: confidence_based
    minimum_confidence: 0

# Vault: reversible PII tokenization. When enabled, PII that would be REDACTed is
# replaced with numbered placeholders on the way to the provider and restored to
# the original values in the response — so the user keeps full data instead of
# masked output. Requires TAMGA_VAULT_KEY (base64 32-byte) for at-rest encryption.
# To vault (rather than block) TC Kimlik, move tc_kimlik/credit_card into the
# REDACT rule above and enable this.
vault:
  enabled: false

# Canary tokens: inject a unique invisible token into the outgoing system prompt;
# if it appears in the response, the system prompt has leaked (prompt-injection
# exfiltration) — raise a system_prompt_leak finding, and block the response when
# block_on_leak is set. Providers defaults to openai + anthropic.
canary:
  enabled: false
  block_on_leak: true
  providers: []

# An entry here (and under "competitors") sets its own action. A rule keyed
# "custom" or "competitor" applies to the matches as well, and the stronger
# of the two wins. REDACT masks a match as [<name>_REDACTED]; it can be asked
# of PII, secrets, custom entities and competitor names, and not of an
# injection or content-moderation rule, which have no span to mask.
custom_entities:
  - name: "musteri_no"
    pattern: "MN-\\d{8}"
    description: "Müşteri numarası (MN-12345678 formatı)"
    severity: "high"
    action: REDACT
    confidence: 0.90

  - name: "dosya_no"
    pattern: "DSY-\\d{4}/\\d{6}"
    description: "İç dosya numarası"
    severity: "medium"
    action: WARN
    confidence: 0.85

  - name: "sicil_no"
    pattern: "SN\\d{6}"
    description: "Personel sicil numarası"
    severity: "high"
    action: REDACT
    confidence: 0.90


rate_limit:
  max_requests_per_minute: 60
  max_tokens_per_day: 500000
  action_on_exceed: BLOCK

# Incoming LLM request body caps (bytes). Override with TAMGA_MAX_BODY_BYTES when unset here.
body_limits:
  default:
    max_bytes: 1048576
  per_provider:
    # The Anthropic API itself accepts up to 32 MB. Agent sessions get there:
    # a long history, file contents and screenshots travel in every request.
    anthropic:
      max_bytes: 33554432
    openai:
      max_bytes: 1048576

# ---------------------------------------------------------------------------
# Operator-state scanner (jugeni-contracts v1 audit-log integration)
# ---------------------------------------------------------------------------
# Consumes jugeni's append-only audit log (paths via TAMGA_OPERATOR_STATE_*
# env vars) and asserts decision state before the LLM call. Request identity
# comes from headers: X-Tamga-Operator-Id, X-Tamga-Active-Decisions (CSV),
# X-Tamga-Last-Verifiable-By (RFC3339).
operator_state:
  enabled: true
  # Unknown decision refs under a governed pattern: deny (default) | allow.
  on_unknown_ref: deny
  # Locked decisions whose diagnostic cadence lapsed longer ago than this are
  # reported as stale_lock (warn). Overridable per request.
  freshness_ttl: "168h"
  assertions:
    - decision_pattern: "D-.*"
      required_state: locked
      action_on_fail: block
      severity: critical
      description: "Referenced decisions must be locked before prompts may rely on them"
  # Operator allowlists per decision pattern. Empty = no authorization checks.
  authorization: []

# Names are the proxy's route names: openai, anthropic, azure, gemini, bedrock,
# mistral, local. Vendor-style aliases (azure_openai, google_vertex) also work.
providers:
  allowed: [openai, anthropic, azure, gemini]
  blocked: []
  # FAZ2 — optional per-route upstream chains (fallback + circuit breaker). Example:
  # pools:
  #   anthropic:
  #     strategy: fallback_chain
  #     providers:
  #       - name: anthropic-primary
  #         base_url: "https://api.anthropic.com"
  #         api_key_env: "ANTHROPIC_API_KEY"
  #         priority: 1
  #         timeout: 30s
  #       - name: anthropic-gateway
  #         base_url: "https://llm-gateway.internal"
  #         api_key_env: "ANTHROPIC_API_KEY_EU"
  #         priority: 2
  #         timeout: 30s
  # An endpoint may point at the route's own vendor host, at the route's
  # TAMGA_<PROVIDER>_URL, or at a host the operator listed in
  # TAMGA_UPSTREAM_ALLOW (the second one above needs
  # TAMGA_UPSTREAM_ALLOW=llm-gateway.internal). api_key_env must be an
  # upper-case *_API_KEY or *_API_KEY_<SUFFIX> name, never a TAMGA_ one.
  # A policy that breaks either rule does not load. See docs/operations.md.

# Outbound scan: non-streaming responses use output_rules.buffer_bytes; for SSE/NDJSON
# set streaming.enabled: true (FAZ1 Prompt 2 — fail-close on BLOCK).
# Responses are scanned only when this section is enabled. block_on and
# redact_on name finding types or categories, and a finding that neither
# names is let through. code_leak marks any answer that contains source code
# (a code block, import lines, a function): put it in block_on only where
# the model must never answer with code.
# output_rules:
#   enabled: true
#   buffer_bytes: 262144
#   scan_window_ms: 200
#   block_on: [aws_access_key, github_token]
#   streaming:
#     enabled: false
#     max_buffer_bytes: 8192
#
# Links in an answer are judged by their form (no request is made, no name
# resolved): malicious_link findings, with categories link_exfiltration,
# link_userinfo, link_homoglyph, link_scheme, link_text_mismatch,
# link_ip_host, link_port and link_denied_host. redact_on replaces the
# link's address. deny_hosts and allow_hosts are host names; an entry covers
# the host and what is under it.
#   redact_on: [malicious_link]
#   links:
#     deny_hosts: [files.example.net, "*.tracker.example"]
#     allow_hosts: [charts.example.com]     # your own domains: not judged by form
#
# The places tools may send data to. A tool call in an answer whose tool
# matches an entry and whose arguments name a host or an e-mail domain the
# entry does not allow is a tool_destination finding; name it in block_on
# to withhold the call. A tool no entry names is not checked. See
# docs/agents.md, "Limit where tools may send data".
#   block_on: [tool_destination]
#   tool_destinations:
#     - tools: [send_email, "mcp__mail__*"]
#       allow: [example.com]
#
# An answer that repeats the request's system prompt word for word, or holds
# a canary string you wrote into your system prompts, is a system_prompt_leak
# finding (canary_string, system_prompt_verbatim); name it in block_on to
# withhold the answer. Only hashes of the prompt's runs of eight words are
# kept, for the time of the request. See docs/operations.md, "System-prompt
# leaks in answers".
#   block_on: [system_prompt_leak]
#   prompt_leak:
#     canaries: ["zq-7741-canary-ankara"]   # 8 to 64 bytes each
#     system_prompt:
#       enabled: true
#       min_words: 20   # a run this long, word for word, is a leak
#       overlap: 0.5    # so is this share of the prompt's runs of eight words
#
# An answer that is meant to be JSON can be held to a schema. A mismatch is
# an output_schema finding (schema_mismatch, or not_json): in block_on it
# withholds the answer, otherwise it is recorded. when: requested checks an
# answer whose request asked for JSON, always checks every answer. Only the
# keywords listed in docs/operations.md are accepted; another one fails the
# load. A streamed answer is held until it is complete when the mismatch is
# in block_on.
#   block_on: [output_schema]
#   json_schema:
#     when: requested
#     schema:
#       type: object
#       required: [answer]
#       additionalProperties: false
#       properties:
#         answer: {type: string, maxLength: 2000}
#         confidence: {type: number, minimum: 0, maximum: 1}

# ---------------------------------------------------------------------------
# Scan stage
# ---------------------------------------------------------------------------
# on_malformed: what to do with a JSON body that two parsers can read
# differently — a key repeated in one object, bytes that are not UTF-8, or
# text that is not strict JSON (comments, trailing commas).
#   block     answer 400 (code tamga_invalid_json). The default.
#   raw_scan  scan the body as plain bytes and forward it, with
#             X-Tamga-Scan-Mode: raw on the response.
#
# on_error: what to do when the scan itself fails — a scanner errors or
# panics, the scan times out, or a scanner is shed under load.
#   block  answer 503 (code tamga_scan_unavailable). Shipped here.
#   pass   forward on the findings of the scanners that did run, with
#          X-Tamga-Scan-Degraded: true.
# Left out, a plain chat request is forwarded as with pass, and a request that
# carries tool results or tool definitions (agent traffic) is refused as with
# block. Set it either way to get the same answer for both. Block is set
# below because a crashed check must not let an injected tool result through.
#
# default_action: the action for a finding whose type has no rule at all
# (BLOCK, WARN, LOG or PASS). It does not affect findings a rule leaves
# alone on purpose (below its sensitivity, outside its types or roles).
#
# Actions, strongest first: BLOCK, ROUTE, STRIP, REDACT, WARN, LOG, PASS.
#   ROUTE sends the request, as written, to a pool of model servers you run
#   yourself and not to the provider: the caller gets an answer and the text
#   does not leave. If the pool cannot take it the request is blocked; it is
#   never sent to the provider instead. Every ROUTE of a policy names the
#   same pool. The pool is defined under providers.pools with internal: true,
#   and its address must be in TAMGA_UPSTREAM_ALLOW in the proxy's
#   environment. See docs/operations.md, "Routing to an internal model".
#
#   rules:
#     pii: { action: ROUTE, route_to: internal-llm, sensitivity: low, types: [tc_kimlik, credit_card] }
#   providers:
#     pools:
#       internal-llm:
#         internal: true                  # model servers of your own
#         dialect: openai                 # openai or anthropic; no translation between them
#         model: llama-3.1-70b            # replaces the model the caller named (optional)
#         allow_private_addresses: true   # needed for a private or loopback address
#         providers:
#           - { name: vllm-1, base_url: "http://10.0.4.12:8000", api_key_env: INTERNAL_LLM_API_KEY, priority: 1 }
#
#   STRIP replaces the whole piece of text a finding is in with a placeholder
#   and forwards the request. It is for agents: an injection in a tool result
#   is taken out and the session goes on, where BLOCK would end the turn. To
#   strip in tool results and block everywhere else, use the two rule keys a
#   finding type has:
#
#     injection_detection: { action: STRIP, sensitivity: low, applies_to: [tool] }
#     injection:           { action: BLOCK, sensitivity: low,
#                            applies_to: [system, user, assistant, tool_definition, request] }
#
#   For a tool result that is JSON, scan.strip_scope: field (below, off
#   here) replaces only the strings that hold the instruction and keeps the
#   rest of the tool result; text, the default, replaces all of it.
#
# classifier: a local model that reads the text the rules did not block and
# reports what it takes for an injection as an `injection` finding of
# category `classifier`. Off here because it needs the classifier service
# and a model (docs/operations.md, "Inline classifier"). To turn it on:
#
#   classifier:
#     enabled: true
#     timeout_ms: 150     # how long a request may wait; a miss follows on_error
#     threshold: 0.98     # lower catches more and flags more ordinary text
#     signal_threshold: 0.90  # for text with an unreadable block, hidden
#                             # characters, a change of script, or the shape
#                             # of an order to the model (a persona, a
#                             # system label, a new task, a dictated answer)
#     shadow_threshold: 0.98  # only with a shadow model in the service: where
#                             # its recorded scores count as "would flag"
#     roles: [user, tool] # whose text is sent
#     max_chars: 6000     # per request, newest first; the rest is not classified
scan:
  on_malformed: block
  on_error: block
  default_action: WARN

# topics: subjects you do not want requests about, written in free text in
# Turkish or English and matched by meaning, by a second, optional model in
# the classifier service. A match is a finding of type `topic` whose
# category is the topic's name; it carries the name and the score, never the
# text. Off here because it needs that model (docs/operations.md, "Banned
# topics"). With on_error: block as above, turning it on without the model
# refuses every request. To turn it on:
#
#   topics:
#     enabled: true
#     action: WARN        # BLOCK, STRIP, WARN, LOG or PASS; not REDACT
#     threshold: 0.8      # Turkish descriptions score lower: 0.6 to 0.7
#     timeout_ms: 600     # a miss follows on_error
#     roles: [user]       # whose text is read
#     max_chars: 1000     # per request, newest first; a long text is read in part
#     banned:
#       - name: credit-score-change
#         description: "a request to change a customer's credit score"
#       - name: maas-sorgusu
#         description: "adı verilen bir çalışanın maaşını sorma"
#         threshold: 0.65  # a topic may set its own

# ---------------------------------------------------------------------------
# Languages a request may be written in (off here)
# ---------------------------------------------------------------------------
# A message whose prose is, for more than max_foreign_share of its letters,
# in a language outside allow gets a finding of type language (category
# language_not_allowed) that names the languages and their shares, never the
# text. Code, stack traces, log lines, URLs, addresses, paths, identifiers
# and numbers are not prose and are not counted; a message with fewer than
# min_letters letters of prose is not judged. Answers are not checked.
#
#   language:
#     enabled: true
#     allow: [tr, en]         # ISO 639-1; a code the detector does not know fails the load
#     action: WARN            # BLOCK, STRIP, WARN, LOG or PASS (WARN when left out)
#     min_letters: 40
#     max_foreign_share: 0.3  # 0 lets no foreign piece through
#     scope: [user, tool]     # system, user, tool
#
# The detector's models take about 50 MiB of memory, loaded only when a
# policy turns this on. See docs/operations.md, "Languages a request may be
# written in".

# ---------------------------------------------------------------------------
# Files a request carries (off here)
# ---------------------------------------------------------------------------
# Without this section a PDF, an office document or an image in a request
# goes to the provider unread. With it, an encrypted file gets a finding of
# type attachment_unreadable (category encrypted); with extract on, PDF,
# DOCX, XLSX and PPTX files are read by the analyzer and their text is
# scanned like any other; what cannot be read gets the same finding with
# the reason. A value to mask, or a text to strip, inside a file blocks the
# request: files are not rewritten. See docs/operations.md, "Files a
# request carries".
#
#   attachments:
#     unreadable: WARN      # PASS, WARN or BLOCK (PASS when left out)
#     encrypted: BLOCK      # PASS, WARN or BLOCK (PASS when left out)
#     extract:
#       enabled: true
#       max_bytes: 10485760 # 1 KiB to 32 MiB
#       max_pages: 200
#       timeout_ms: 10000
#     ocr:
#       enabled: false      # images and scanned PDFs; needs the analyzer's OCR engine

# ---------------------------------------------------------------------------
# High-risk tool calls after untrusted tool content (off here)
# ---------------------------------------------------------------------------
# A request whose conversation holds a tool result with a finding the
# policy let through (a warning, a quoted injection, a stripped result) is
# tainted. A call in its answer to a tool listed here is withheld (BLOCK)
# or recorded (WARN): the instruction for it may have come from the tool
# result. Works on buffered and streamed answers, with output_rules on or
# off. See docs/agents.md, "Hold high-risk tool calls after untrusted
# content".
#
#   agents:
#     provenance:
#       enabled: true
#       high_risk_tools: [bash, run_shell, write_file, delete_file, send_email, "http_*"]
#       taint_on: [injection, quoted_injection, hidden_text]   # the default
#       action: BLOCK           # or WARN

# ---------------------------------------------------------------------------
# RBAC exception framework (opt-in)
# ---------------------------------------------------------------------------
# Exceptions allow specific admin/security roles to bypass policy rules with
# full audit logging. When a request carries the X-Tamga-Role header (e.g.
# "admin" or "security_lead") and the role matches an exception for a rule, that
# rule is skipped entirely — BLOCK becomes allow, REDACT returns raw content.
#
# Security notes:
#   - X-Tamga-Role is an unauthenticated header, so it is IGNORED unless
#     TAMGA_TRUST_ROLE_HEADER=true. Turn that on only when an authenticating
#     gateway in front of Tamga strips the header from client requests and
#     sets it itself; otherwise any caller can claim a role.
#   - Rule names must match exactly (no wildcards).
#   - Every exception application is audit-logged as event=exception_applied.
#   - Expired exceptions are silently ignored (not a parse error).
#   - Set TAMGA_STRICT_MODE=true to disable ALL exceptions globally (kill-switch).
#   - Valid roles: admin, analyst, viewer, security_lead
#
# Example (uncomment to enable):
#
# exceptions:
#   - rule: "pii-scan-enforcement"
#     roles: ["admin", "security_lead"]
#     reason: "Admins inspecting production data need raw view"
#     expires_at: "2026-12-31T00:00:00Z"  # optional, omit for permanent
#
#   - rule: "secret_detection"
#     roles: ["admin"]
#     reason: "CI/CD pipeline token testing bypass"
#     # no expires_at = permanent exception
