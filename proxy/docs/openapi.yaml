        "200":
          description: OK
        "403":
          $ref: "#/components/responses/PermissionDenied"

    patch:
      tags: [scim]
      summary: Patch SCIM user
      x-required-role: admin
      x-required-permission: "scim:admin"
      parameters:
        - in: path
