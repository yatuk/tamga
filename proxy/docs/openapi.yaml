                - required: [tckn]
                  properties:
                    tckn: { type: string, pattern: "^[1-9][0-9]{10}$", description: "A national id" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deleted: { type: integer }
        "400":
          description: Missing or invalid identifier
        "403":
          $ref: "#/components/responses/PermissionDenied"

