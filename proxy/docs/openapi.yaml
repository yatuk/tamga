      responses:
        "200":
          description: OK
        "403":
          $ref: "#/components/responses/PermissionDenied"

# ══════════════════════════════════════════════════════════════════════
# Components
# ══════════════════════════════════════════════════════════════════════
components:
  responses:
    PermissionDenied:
      description: The caller is authenticated and its role does not carry the permission the route asks for. Nothing was read or changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PermissionDenied"
    SessionsUnavailable:
      description: |
        `sessions_unavailable`: the proxy has no signing secret
        (`TAMGA_JWT_SECRET`), so it issues, reads and ends no session. Every
        session route answers this, whatever it was sent. On the two GitHub
        routes also `github_oauth_not_configured`: there is a secret and no
        GitHub OAuth app.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionsUnavailable"

  securitySchemes:
    AdminKey:
      type: apiKey
      in: header
      name: X-Tamga-Admin-Key
    ApiKey:
      type: apiKey
      in: header
      name: X-Tamga-Admin-Key
      description: Scoped API key. `read` acts as viewer, `write` as analyst, `admin` as admin; a `proxy` key is refused (403) on every management route.
    SessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The session token a sign-in returns. Accepted on every management route, with the role its user has now.
    TamgaKey:
      type: apiKey
      in: header
      name: X-Tamga-Key
      description: Tamga key of any scope, proxy included. In the management API it opens POST /api/v1/scan and POST /api/v1/beta/litellm_basic_guardrail_api, and nothing else.
    LiteLLMKey:
      type: apiKey
      in: header
      name: x-api-key
      description: The same Tamga key, in the header LiteLLM sends a guardrail's api_key in. Read on POST /api/v1/beta/litellm_basic_guardrail_api only.

  schemas:
    # ── Shared ────────────────────────────────────────────────────────

    ReportRange:
      type: string
      enum: [24h, 7d, 30d]
      default: 7d
      description: Time range window

    # ── Health ────────────────────────────────────────────────────────

    Health:
      type: object
      properties:
        status: { type: string }
        service: { type: string }

    DashboardHealthProviderEndpoint:
      type: object
      properties:
        name: { type: string }
        state: { type: string }
        success_rate_observed: { type: number }
        p95_latency_ms: { type: number }
        requests_in_window: { type: integer }
        last_failure: { type: string }
        failure_reason:
          type: string
          description: The class of the last failure. The error text itself is only in the proxy's log.
          enum: [timeout, refused, dns, tls, upstream_5xx, not_allowed, other]

    DashboardHealthProviderPool:
      type: object
      properties:
        pool: { type: string }
        healthy_count: { type: integer }
        total_count: { type: integer }
        providers:
          type: array
          items:
            $ref: "#/components/schemas/DashboardHealthProviderEndpoint"

    DashboardHealthDetailed:
      type: object
      description: |
        Only proxy, proxy_status, status, authenticated and the scan latency
        percentiles are sent to a caller without a management credential.
      properties:
        proxy: { type: string }
        proxy_status:
          type: object
          properties:
            up: { type: boolean }
        status:
          type: string
          description: degraded when a dependency is failing, as the 503 says.
          enum: [ok, degraded]
        authenticated:
          type: boolean
          description: True when the caller's credential was accepted and this is the full body.
        database: { type: string }
        redis: { type: string }
        analyzer: { type: string }
        scanner_count: { type: integer }
        uptime_seconds: { type: integer }
        policy_path: { type: string }
        events_dropped: { type: integer }
        scan_latency_ms_p50: { type: number }
        scan_latency_ms_p95: { type: number }
        scan_latency_ms_p99: { type: number }
        providers:
          type: array
          items:
            $ref: "#/components/schemas/DashboardHealthProviderPool"

    DashboardHealthDetail:
      allOf:
        - $ref: "#/components/schemas/DashboardHealthDetailed"
        - type: object
          properties:
            version: { type: string }
            policy_name: { type: string }
            policy_writable: { type: boolean }
            tls_enabled: { type: boolean }
            mtls_enabled: { type: boolean }
            ip_allowlist: { type: string }
            redis_enabled: { type: boolean }
            timestamp: { type: string, format: date-time }
            trace_ui_url: { type: string }
            retention_enabled: { type: boolean }
            retention_last_run: { type: string, format: date-time }

