      x-required-permission: "team:admin"
      description: |
        If Clerk is configured, merges Clerk user profiles with local
        role assignments. Returns `clerk: false` when Clerk is unavailable.

        Being listed by Clerk assigns nothing. An account nobody assigned a
        role is listed with `role` equal to `default_role`: empty (it has no
        access) unless the operator set `TAMGA_SSO_DEFAULT_ROLE=viewer`.
        `assigned` tells the two apart: it is true only when an admin gave
        the account the role shown.

        An account whose role was removed stays in the list for 30 days,
        with or without Clerk, as an unassigned one: `assigned: false`,
        `role_removed: true`, `role` equal to `default_role`, and the
        moment its sessions ended in `sessions_valid_from`. An account that
        only signed out, or whose sessions an admin ended, without ever
        having a role is listed only when Clerk lists it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamMember"
                  total: { type: integer }
                  clerk: { type: boolean }
                  default_role:
                    type: string
                    enum: ["", viewer]
                    description: The role of a signed-in account nobody assigned one (`TAMGA_SSO_DEFAULT_ROLE`). Empty means such an account is refused.
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /api/v1/team/{id}/role:
    put:
      tags: [team]
      summary: Set a team member's role
      x-required-role: admin
      x-required-permission: "team:admin"
      description: |
        A role that differs from the one the user had ends the user's
        sessions, a promotion included: the tokens issued before get 401
        `session_revoked` and the user signs in again. Assigning the role
        the user already has changes nothing.

        The check for the last admin and the write are one step, so two
        demotions at the same moment cannot both succeed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/TeamRole"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          description: Invalid role, body or user id
        "403":
          description: |
            `permission_denied`: the caller is not an admin.
            `own_role`: the caller is the user named in the path; nobody sets their own role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDenied"
        "409":
          description: "`last_admin`: the user is the only admin in the user store and the new role is not admin."
        "503":
          description: Users store unavailable

    delete:
      tags: [team]
      summary: Remove a team member's role
      x-required-role: admin
      x-required-permission: "team:admin"
      description: |
        The account keeps no role: its sessions end (401 `session_revoked`)
        and it cannot sign in again (403 `account_not_assigned`), unless the
        operator set `TAMGA_SSO_DEFAULT_ROLE=viewer`, in which case it signs
        in as a viewer. A role assigned later does not bring back a token
        from before. Written to the audit log as `team.role.remove`.

        The account stays in `GET /api/v1/team` for 30 days, without a role.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  user_id: { type: string }
                  assigned:
                    type: boolean
                    description: Always false. No admin-given role is left.
                  sessions_valid_from:
                    type: integer
                    format: int64
                    description: Unix seconds. The moment the account's sessions ended; a token issued at or before it is refused.
        "400":
          description: Invalid user id
        "403":
          description: |
            `permission_denied`: the caller is not an admin.
            `own_role`: the caller is the user named in the path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDenied"
        "404":
          description: The account has no role
        "409":
          description: "`last_admin`: the user is the only admin in the user store."
        "503":
          description: Users store unavailable

  /api/v1/team/{id}/sessions/revoke:
    post:
      tags: [team]
      summary: Revoke a user's sessions
      x-required-role: admin
      x-required-permission: "team:admin"
      description: |
        Every session token the user holds now stops working (401
        `session_revoked`) and the user signs in again. The role is not
        touched. The user need not have a role. Written to the audit log as
        `team.sessions.revoke`, with the caller as actor.

        The replica that serves the call refuses the tokens from the next
        request on; other replicas do within 30 seconds, when they next
        reload the team roles.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  user_id: { type: string }
                  assigned:
                    type: boolean
                    description: Whether the account has a role an admin gave it. Revoking sessions does not change that.
                  sessions_valid_from:
                    type: integer
                    format: int64
                    description: Unix seconds. A token issued at or before it is refused.
        "400":
          description: Invalid user id
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          description: Users store unavailable, or the revocation could not be stored

  # ────────────────────────────────────────────────────────────────────
  # Billing
  # ────────────────────────────────────────────────────────────────────
  /api/v1/billing/pricing:
    get:
      tags: [billing]
      summary: List active model pricing entries
      x-required-role: viewer
      x-required-permission: "read"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pricing:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelPricing"
                  currency: { type: string }
                  updated_at: { type: string, format: date-time }
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          description: Pricing store not configured

  /api/v1/billing/costs/breakdown:
    get:
      tags: [billing]
      summary: Per-model cost breakdown for a time range
      x-required-role: viewer
      x-required-permission: "read"
      description: |
        Sums the token counts stored with each request and prices them with
        the prices in force now. Only requests whose usage the proxy read
        are in it: a response it buffered (output scanning or the vault is
        on) that carried a usage block. Streamed responses, cache hits and
        requests stored before token counts were recorded add nothing, so
        the totals are a lower bound on what the providers billed.
      parameters:
        - in: query
          name: range
          schema:
            $ref: "#/components/schemas/ReportRange"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  range: { type: string }
                  daily:
                    type: array
                    items:
                      $ref: "#/components/schemas/DailyCostRow"
                  breakdown:
                    type: array
                    items:
                      $ref: "#/components/schemas/CostBreakdownRow"
                  unpriced:
                    type: array
                    description: Models with usage but no price. Their tokens are in no USD total.
                    items:
                      $ref: "#/components/schemas/UnpricedModel"
                  total_usd: { type: number }
                  mtd_total_usd: { type: number }
                  projected_monthly_usd: { type: number }
        "403":
          $ref: "#/components/responses/PermissionDenied"

  # ────────────────────────────────────────────────────────────────────
  # Budget
  # ────────────────────────────────────────────────────────────────────
  /api/v1/budget/stats:
    get:
      tags: [budget]
      summary: Daily token + cost counters for the deployment's organisation
      x-required-role: viewer
      x-required-permission: "read"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetStats"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  # ────────────────────────────────────────────────────────────────────
  # Maintenance
  # ────────────────────────────────────────────────────────────────────
  /api/v1/maintenance/retention:
    post:
      tags: [maintenance]
      summary: Trigger a retention maintenance cycle
      x-required-role: admin
      x-required-permission: "maintenance:admin"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  last_run: { type: string, format: date-time }
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          description: Retention not enabled

  /api/v1/maintenance/circuit-reset:
    post:
      tags: [maintenance]
      summary: Reset a circuit breaker for an upstream pool/endpoint
      x-required-role: admin
      x-required-permission: "maintenance:admin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pool, endpoint]
              properties:
                pool: { type: string }
                endpoint: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  pool: { type: string }
                  endpoint: { type: string }
        "400":
          description: Missing pool or endpoint
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          description: Upstream registry not configured

  # ────────────────────────────────────────────────────────────────────
  # Reports
  # ────────────────────────────────────────────────────────────────────
  /api/v1/reports/owasp/pdf:
    get:
      tags: [reports]
      summary: OWASP LLM Top 10 coverage report as a PDF
      x-required-role: viewer
      x-required-permission: "read"
      description: |
        The analyzer generates the report and the proxy passes it on. It
        describes which OWASP LLM Top 10 risks the deployed detections cover:
        it prints no traffic figures and nothing from the caller's request.
        `range` is accepted and has no effect on the content today.

        The proxy asks the analyzer at `TAMGA_ANALYZER_HTTP_URL`. Nothing in
        the request chooses the address or the path, and no header of the
        request or of the analyzer's answer is passed on.
      parameters:
        - in: query
          name: range
          schema:
            $ref: "#/components/schemas/ReportRange"
      responses:
        "200":
          description: The report, as an attachment named `tamga-owasp-report.pdf`
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          description: The analyzer has no PDF library installed. The body is the analyzer's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPdfUnavailable"
        "502":
          description: "`analyzer_error`: the analyzer answered, and not with a report"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportError"
        "503":
          description: |
            `analyzer_not_configured` (`TAMGA_ANALYZER_HTTP_URL` is not set or
            is not an http(s) address) or `analyzer_unavailable` (it did not
            answer).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportError"
        "504":
          description: "`analyzer_timeout`: the analyzer did not answer in time"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportError"

  /api/v1/reports/incident/pdf:
    get:
      tags: [reports]
      summary: Incident summary for a range as a PDF
      x-required-role: viewer
      x-required-permission: "read"
      description: |
        The figures the report prints (requests, blocked, redacted, warned,
        and the period in hours) are counted by the proxy for `range`, the
        way `GET /api/v1/stats` counts them and for the same organisation:
        the two agree for the same range. The analyzer lays the report out.

        The caller chooses the range and nothing else. `total_requests`,
        `blocked`, `redacted`, `warned` and `period_hours` in the query are
        ignored: they are not an error, so a console that still sends them
        keeps working, and they have no effect on the report.

        With a database the counts are for the range and
        `X-Tamga-Data-Source` is `database`. Without one, or when it does not
        answer, they are the counters of the serving process, which count
        since it started whatever the range: the header is then `memory` and
        the period the report prints is the time the process has run, in
        whole hours rounded up. When neither can be read the answer is 503
        and no report.
      parameters:
        - in: query
          name: range
          schema:
            $ref: "#/components/schemas/ReportRange"
      responses:
        "200":
          description: The report, as an attachment named `tamga-incident-report.pdf`
          headers:
            X-Tamga-Data-Source:
              description: Where the counts came from
              schema: { type: string, enum: [database, memory] }
            X-Tamga-Report-Range:
              description: The range the report was asked for
              schema:
                $ref: "#/components/schemas/ReportRange"
            X-Tamga-Report-Period-Hours:
              description: The period the report prints, in hours. 24, 168 or 720 from the database; the hours the process has run from memory.
              schema: { type: integer, minimum: 1 }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400":
          description: "`invalid_range`: `range` is not one of `24h`, `7d`, `30d`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          description: The analyzer has no PDF library installed. The body is the analyzer's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPdfUnavailable"
        "502":
          description: "`analyzer_error`: the analyzer answered, and not with a report"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportError"
        "503":
          description: |
            `report_counts_unavailable` (the database did not answer and the
            process keeps no counters: nothing was asked of the analyzer),
            `analyzer_not_configured` or `analyzer_unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportError"
        "504":
          description: "`analyzer_timeout`: the analyzer did not answer in time"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportError"

  # ────────────────────────────────────────────────────────────────────
  # Settings
  # ────────────────────────────────────────────────────────────────────
  /api/v1/settings/sso:
    get:
      tags: [settings]
      summary: The stored SSO settings
      x-required-role: viewer
      x-required-permission: "read"
      description: |
        The SAML/OIDC settings stored for the deployment's organisation. They
        hold no secret. They are a record: the proxy has no SAML or OIDC
        sign-in that reads them (see the two Clerk callbacks, which answer
        501).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOSettings"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    put:
      tags: [settings]
      summary: Replace the stored SSO settings
      x-required-role: admin
      x-required-permission: "sso:admin"
      description: |
        Replaces the whole document. `provider_type` and `domain` are
        lower-cased and trimmed; an `attribute_mapping` that is left out is
        stored as `{"email": "email", "name": "displayName"}`. A change is
        written to the audit log as `sso.update` with the names of the fields
        that changed, not their values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSOSettings"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  config:
                    $ref: "#/components/schemas/SSOSettings"
        "400":
          description: The body is not JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "422":
          description: A field is not valid. Nothing was stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "validation failed" }
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string, enum: [provider_type, metadata_url, domain] }
                        message: { type: string }
        "503":
          description: The change could not be stored. Nothing was changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  # ────────────────────────────────────────────────────────────────────
  # Providers
  # ────────────────────────────────────────────────────────────────────
  /api/v1/providers:
    get:
      tags: [providers]
      summary: List provider routes and the models seen on each (with pricing when known)
      x-required-role: viewer
      x-required-permission: "read"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
