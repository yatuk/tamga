openapi: 3.0.3
info:
  title: Tamga AI Security Proxy API
  version: 0.1.1
  description: |
    Tamga bir in-line LLM güvenlik proxy'sidir. OpenAI/Anthropic/Gemini/Mistral/Bedrock
    endpointlerini karşılar, policy motoru ile PII/secret/jailbreak taraması
    uygular ve dashboard yönetim API'lerini sağlar.

    Kimlik doğrulama iki şekilde yapılır:
    1. `X-Tamga-Admin-Key` başlığı (ana admin anahtarı)
    2. Scoped API key (`read`, `write`, `admin`)

    Authorisation. Every management route asks for one permission
    (`x-required-permission`), and `x-required-role` is the least role that
    carries it. The role comes from the credential and from nothing the
    client writes: the static admin key is `admin`; an API key is `viewer`
    (scope `read`), `analyst` (`write`) or `admin` (`admin`); a session
    token (`Authorization: Bearer`) has the role the user store holds for
    its user now, and `viewer` when the store holds none. A `viewer` reads,
    an `analyst` also does triage, saved hunts, exports and the policy
    sections open to analysts, and everything that decides who may do what
    or where data goes is for an `admin`. A route with no declared
    permission is refused to everyone. Without a credential the answer is
    401; with one whose role lacks the permission it is 403
    (`PermissionDenied`), before the body is read.

    The key is sent in the `X-Tamga-Admin-Key` header. A key in the query
    string is not read on any route: a URL ends up in access logs and in
    browser history.
  contact:
    name: Tamga Security
    email: security@tamgaproxy.com
    url: https://tamgaproxy.com/trust

servers:
  - url: http://localhost:8443
    description: A proxy you run. There is no hosted API; put your own address here.

security:
  - AdminKey: []
  - ApiKey: []

tags:
  - name: health
    description: Health check and runtime diagnostics
  - name: auth
    description: OAuth / SSO authentication (no auth required)
  - name: stats
    description: Dashboard overview statistics
  - name: events
    description: Security event listing, detail, export, and privacy
  - name: timeseries
    description: Bucketed time series data
  - name: findings
    description: Finding-type breakdowns
  - name: incidents
    description: Incident lifecycle management
  - name: mttr
    description: Mean Time to Resolution metrics
  - name: audit
    description: Audit log and hash-chain verification
  - name: live
    description: Server-Sent Events stream
  - name: policies
    description: Policy CRUD, validation, simulation, custom entities, history, proposals
  - name: scan
    description: Policy verdict for a text, without calling a provider
  - name: apikeys
    description: Scoped API key management
  - name: webhooks
    description: Webhook destination management
  - name: metrics
    description: Prometheus metrics text and histogram JSON
  - name: patterns
    description: Custom detection pattern CRUD
  - name: saved-hunts
    description: Server-side saved threat-hunting queries
  - name: team
    description: Team member listing and role assignment
  - name: billing
    description: Pricing catalogue and cost breakdowns
  - name: maintenance
    description: Retention and circuit-breaker reset
  - name: budget
    description: Organisation-level token/cost budget
  - name: providers
    description: Supported LLM provider catalogue
  - name: ratelimit
    description: Rate limiter statistics
  - name: reports
    description: PDF reports generated by the analyzer
  - name: settings
    description: Stored deployment settings
  - name: proxy
    description: Proxied chat completions endpoint
  - name: scim
    description: SCIM v2 user provisioning

paths:
  # ────────────────────────────────────────────────────────────────────
  # Health
  # ────────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/health/detailed:
    get:
      tags: [health]
      summary: Detailed health status with provider pool snapshots
      description: |
        Without a credential: whether the proxy is up, `status` (`ok` or
        `degraded`) and the scan latency percentiles. Nothing else.

        With the admin key or a scoped key of read, write or admin scope in
        `X-Tamga-Admin-Key` (or a session token in `Authorization`): also
        database, Redis and analyzer status, scanner count, uptime, the
        policy file path and the upstream provider pool snapshots.
        `authenticated` says which of the two bodies this is.

        A proxy-scope key, a revoked key and a wrong key get the first
        body, not an error. A key in the query string is not read.

        Returns 503 when any dependency (DB/Redis/analyzer) is unhealthy,
        to every caller.
      security:
        - {}
        - AdminKey: []
        - ApiKey: []
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardHealthDetailed"
        "503":
          description: One or more dependencies unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardHealthDetailed"

  /api/v1/health/detail:
    get:
      tags: [health]
      summary: Runtime operational profile
      description: |
        Exposes TLS, mTLS, Redis, Postgres status and policy identity for
        the Settings / Runtime dashboard tab.

        All of it needs the admin key or a scoped key of read, write or
        admin scope in `X-Tamga-Admin-Key` (or a session token in
        `Authorization`). Any other caller gets `proxy` and
        `authenticated: false` only, with status 200.
      security:
        - {}
        - AdminKey: []
        - ApiKey: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardHealthDetail"

  # ────────────────────────────────────────────────────────────────────
  # Auth (public — no security required)
  # ────────────────────────────────────────────────────────────────────
  /api/v1/auth/github/login:
    get:
      tags: [auth]
      summary: Redirect to GitHub OAuth login
      description: |
        Starts a sign-in: sets the `tamga_oauth_state` cookie (HttpOnly,
        Secure, SameSite=Lax, 10 minutes) and redirects to GitHub with the
        same value as `state`.
      security: []
      responses:
        "302":
          description: Redirect to GitHub
        "503":
          $ref: "#/components/responses/SessionsUnavailable"

  /api/v1/auth/github/callback:
    get:
      tags: [auth]
      summary: GitHub OAuth callback
      description: |
        Exchanges the code for a session token, and only for the browser
        that started the sign-in: `state` must equal the `tamga_oauth_state`
        cookie `GET /api/v1/auth/github/login` set. This is the only route
        that takes a code. `POST /api/v1/auth/github/exchange`, which took
        one without a state, was removed.
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session token and the user it is for
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      name: { type: string }
                      avatar: { type: string }
                      role: { type: string, enum: [viewer, analyst, admin] }
        "400":
          description: The state cookie is missing, `state` does not match it, or there is no `code`
        "502":
          description: GitHub refused the code or did not answer
        "503":
          $ref: "#/components/responses/SessionsUnavailable"
        "403":
          description: |
            `account_not_assigned`: nobody has given this GitHub account a
            role, so it gets no session. An admin assigns one with
            `PUT /api/v1/team/{id}/role`, where `id` is the `user_id` in this
            body (also sent as `github_user_id`); the static admin key can do
            so before any user exists. With `TAMGA_SSO_DEFAULT_ROLE=viewer`
            the account is let in as a viewer instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNotAssigned"

  /api/v1/auth/session:
    get:
      tags: [auth]
      summary: Get current session info
      description: |
        Answers for the bearer token it is handed, with what the management
        API would say to that token now: the role is the one the user has
        today, not the one the token was signed with.

        A session token is an HS256 JWT signed by this proxy, good for 24
        hours, with `iss: tamga` and `aud: tamga-management`. A token with
        another algorithm in its header, another issuer or audience, or
        none (every token signed before these were checked) is refused.
      security: []
      responses:
        "200":
          description: OK
        "401":
          description: |
            No token, an invalid or expired one, or `session_revoked`: the
            token was issued before its user's sessions were revoked (the
            role changed or was removed, an admin revoked them, or the user
            signed out). The user signs in again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevoked"
        "403":
          description: "`account_not_assigned`: the account has no role now. Every management route answers a session token the same way."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNotAssigned"
        "503":
          $ref: "#/components/responses/SessionsUnavailable"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: |
        Ends every session of the user whose bearer token is sent, that
        token included: nothing is kept per session, so signing out on one
        device signs the user out on all of them. The role is not touched
        and the user can sign in again at once. The call is written to the
        audit log as `auth.logout`.

        The replica that serves the call refuses the tokens from the next
        request on; other replicas do within 30 seconds, when they next
        reload the team roles.

        The route validates the token itself, like `GET /api/v1/auth/session`,
        so a token whose account has lost its role can still be signed out.
        An API key or the admin key is not a session and gets 401.
      security:
        - SessionToken: []
      responses:
        "200":
          description: Signed out. Also the answer for a token that was already revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "401":
          description: No bearer token, or one that is invalid or expired
        "503":
          description: |
            `sessions_unavailable`: no signing secret is configured. This is
            the answer whatever was sent, a token or none. Without a `code`:
            the revocation could not be stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsUnavailable"

  /api/v1/auth/clerk/saml/callback:
    post:
      tags: [auth]
      summary: Not implemented
      description: The proxy has no Clerk sign-in. The route issues no session.
      security: []
      responses:
        "501":
          description: "`clerk_sso_unavailable`"

  /api/v1/auth/clerk/oidc/callback:
    post:
      tags: [auth]
      summary: Not implemented
      description: The proxy has no Clerk sign-in. The route issues no session.
      security: []
      responses:
        "501":
          description: "`clerk_sso_unavailable`"

  # ────────────────────────────────────────────────────────────────────
  # Stats
  # ────────────────────────────────────────────────────────────────────
  /api/v1/stats:
    get:
      tags: [stats]
      summary: Dashboard overview statistics
      x-required-role: viewer
      x-required-permission: "read"
      description: |
        Counted over the asked range from the stored request logs when the
        proxy has a database, so the figures are the same after a restart and
        on every replica; they trail the live feed by the log writer's flush
        interval (about 5 seconds). Without a database, or when it does not
        answer, they come from process memory (counters since start and the
        last ~1000 events) and the range is not applied to the counts.

        The response header `X-Tamga-Data-Source` says which: `database` or
        `memory`. The same header is set on `/stats/models`, `/timeseries`,
        `/findings/breakdown`, `/providers`, `/events/{request_id}` and
        `/events/export`. `avg_input_risk_pct` is left out when it could not
        be worked out.

        `scanner_latency_avg_ms` is the average over the requests that have a
        scan latency stored, in milliseconds with a fraction. Requests stored
        by versions that recorded whole milliseconds, or none, hold zero and
        are not part of the average.
      parameters:
        - in: query
          name: range
          schema:
            $ref: "#/components/schemas/ReportRange"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatsV2"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /api/v1/stats/models:
    get:
      tags: [stats]
      summary: Per-model and per-family request counts
      x-required-role: viewer
      x-required-permission: "read"
      parameters:
        - in: query
          name: range
          schema:
            $ref: "#/components/schemas/ReportRange"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatsResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  # ────────────────────────────────────────────────────────────────────
  # Events
  # ────────────────────────────────────────────────────────────────────
  /api/v1/events:
    get:
      tags: [events]
      summary: List security events (paginated, filterable)
      x-required-role: viewer
      x-required-permission: "read"
      description: |
        Varsayılan zaman penceresi `range=7d`. PostgreSQL açıkken sunucu
        tarafında filtrelenir; aksi halde in-memory Recent buffer üzerinde
        filtre uygulanır (kapasite sınırlı).
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: action
          description: BLOCK, STRIP, REDACT, WARN, LOG or PASS
          schema: { type: string }
        - in: query
          name: provider
          description: Küçük harf provider adı veya `shadow`
          schema: { type: string }
        - in: query
          name: shadow
          description: "true ise yalnızca enterprise olmayan provider'lar"
          schema: { type: boolean }
        - in: query
          name: finding_type
          schema: { type: string, example: pii }
        - in: query
          name: severity
          schema: { type: string, example: high }
        - in: query
          name: category
          description: Bulgu category içinde substring
          schema: { type: string }
        - in: query
          name: technique
          description: findings JSON içinde substring (OWASP kodu vb.)
          schema: { type: string }
        - in: query
          name: q
          description: request_id veya findings metninde arama
          schema: { type: string }
        - in: query
          name: range
          schema:
            $ref: "#/components/schemas/ReportRange"
        - in: query
          name: since
          description: RFC3339 — belirtilirse `range` yerine geçer
          schema: { type: string, format: date-time }
        - in: query
          name: until
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/SecurityEvent"
                  total:
                    type: integer
        "400":
          description: Bad query parameters
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /api/v1/events/{request_id}:
    get:
      tags: [events]
      summary: Get a single security event by request ID
      x-required-role: viewer
      x-required-permission: "read"
      description: |
        Looked up in process memory first and then, in the caller's
        organisation, in the stored request logs (`X-Tamga-Data-Source` says
        which answered). A stored request carries what its row holds, and a
        field the row has no value for is absent, never `null` and never a
        zero standing in for it:

        - `input_tokens` and `output_tokens` are present together, when the
          proxy read the provider's usage: a response it buffered (output
          scanning or the vault is on) that carried a usage block. They are
          absent for a streamed response, a cache hit, a blocked request and
          every request stored before they were recorded.
        - `cost_usd` is what the request was charged: tokens times the
          model's price at the time, and `0` for a cache hit, which calls no
          provider. Otherwise absent when the tokens are, and for a model
          with no price.
        - `policy_name` and `policy_version` are those of the policy the
          request was decided with. Absent on requests stored before they
          were recorded: the policy loaded now is not shown in their place.
        - `output_action`, `output_findings` and `output_risk` describe the
          scan of the response, and are absent when it was not scanned.
          `output_findings` is `[]` for a response that was scanned and
          clean; its matches are masked as those of `findings` are.
        - `scan_latency_ms` and `total_latency_ms` are in milliseconds with a
          fraction; absent on requests stored without them.

        `input_risk` is computed from the stored findings, and each
        finding's `action_taken` is the request's action (for an output
        finding, the response's).
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventDetail"
        "400":
          description: Missing request_id
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          description: Event not found

  /api/v1/events/export:
    get:
      tags: [events]
      summary: Export filtered events as CSV or JSON
      x-required-role: analyst
      x-required-permission: "events:export"
      description: |
        With a database the rows come from the stored request logs, newest
        first, with the filters and window of `GET /api/v1/events`
        (`finding_type`, `severity`, `category`, `technique`, `q`, `since`,
        `until` are accepted as well as the parameters below). One export
        returns at most 50000 rows; when more matched, the response carries
        `X-Tamga-Export-Truncated: true` and the file is the newest 50000:
        narrow the window with `since`/`until` to get the rest. Without a
        database the rows are the events still in process memory
        (`X-Tamga-Data-Source: memory`).
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [csv, json], default: csv }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: provider
          schema: { type: string }
        - in: query
          name: range
          schema:
            $ref: "#/components/schemas/ReportRange"
        - in: query
          name: request_id
          schema: { type: string }
      responses:
        "200":
          description: CSV or JSON attachment
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/SecurityEvent"
                  total: { type: integer }
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      tags: [events]
      summary: Export filtered events (POST variant for larger filters)
      x-required-role: analyst
      x-required-permission: "events:export"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [csv, json], default: csv }
                action: { type: string }
                provider: { type: string }
                range: { $ref: "#/components/schemas/ReportRange" }
                request_id: { type: string }
      responses:
        "200":
          description: CSV or JSON attachment
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /api/v1/events/subject:
    get:
      tags: [events]
      summary: GDPR Art. 15 / KVKK madde 11 subject access
      x-required-role: admin
      x-required-permission: "privacy:access"
      deprecated: true
      description: |
        Return request_log rows for a data subject.

        Prefer `POST /api/v1/events/subject`: here the selector, which names
        a person, is in the query string, and URLs are kept in access logs,
        proxies and browser history. GET stays for existing callers.

        Audited like the POST, with the same rule for `tckn_hash`. A
        national id (`tckn`) is not read here: a request with `tckn` in the
        query string is 400, whatever else it carries.
      parameters:
        - in: query
          name: user_id
          schema: { type: string }
        - in: query
          name: email
          schema: { type: string, format: email }
        - in: query
          name: tckn_hash
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    type: object
                    properties:
                      user_id: { type: string }
                      email: { type: string }
                      tckn_hash: { type: string }
                  rows: { type: array }
                  count: { type: integer }
        "400":
          description: Missing identifier query param
        "403":
          $ref: "#/components/responses/PermissionDenied"

    post:
      tags: [events]
      summary: GDPR Art. 15 / KVKK madde 11 subject access (selector in the body)
      x-required-role: admin
      x-required-permission: "privacy:access"
      description: |
        Return request_log rows for a data subject. The preferred form: the
        selector is in the body and nothing is read from the query string.
        The answer is that of the GET.

        One selector is used: the first that is given of `user_id`, `email`,
        `tckn_hash` and `tckn`.

        `tckn` is a national id as the person gave it: 11 digits with a
        valid checksum, anything else is 400. The server looks for it in
        the findings of the request and of the response, in the forms the
        log may hold it in: the masked match (`10*******46`), its keyed
        hash (`hmac-sha256:…`, with `data.hash_findings`) and the unkeyed
        `sha256:…` of rows written before v0.9.0. The log never held more
        than the masked form, so rows that mention another id with the same
        first and last two digits are returned too. The id is not logged,
        not written to the audit log and not repeated in the answer.

        `tckn_hash` is a stored hash as it is: the 64 lower-case hex
        characters after the prefix, copied from a row. Anything else is
        400. Stored hashes are keyed since v0.9.0, so a caller cannot
        compute one; send `tckn`.

        Every call that names a subject is written to the audit log as
        `privacy.subject_access`, with the verified actor and, in `detail`,
        `selector` (which was used: `user_id`, `email`, `tckn_hash` or
        `tckn`), `rows` (how many were returned) and `result` (`ok`,
        `error` or `store_unavailable`). The selector's value is not
        written, in any form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of the four.
              properties:
                user_id: { type: string }
                email: { type: string, format: email }
                tckn_hash: { type: string, pattern: "^[0-9a-f]{64}$", description: "A stored hash, without its prefix" }
                tckn: { type: string, pattern: "^[1-9][0-9]{10}$", description: "A national id; body only" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    type: object
                    description: The selector as it was sent. A national id is not repeated; `selector` then says `tckn`.
                    properties:
                      user_id: { type: string }
                      email: { type: string }
                      tckn_hash: { type: string }
                      selector: { type: string, enum: [tckn] }
                  rows: { type: array }
                  count: { type: integer }
        "400":
          description: No identifier in the body, or a body that is not JSON
        "403":
          $ref: "#/components/responses/PermissionDenied"

    delete:
      tags: [events]
      summary: KVKK/GDPR subject erase
      x-required-role: admin
      x-required-permission: "privacy:erase"
      description: |
        Deletes the stored request logs of a data subject. The rows are
        deleted, not marked. One selector is used, as on the POST, with the
        same rules for `tckn` and `tckn_hash`.

        A national id finds rows by its masked form, which another id can
        share: read with the POST first, and erase when the rows are the
        ones meant.

        Written to the audit log as `privacy.subject_erase`, with the
        verified actor and, in `detail`, `selector` (`user_id`, `email`,
        `tckn_hash` or `tckn`), `deleted` and `result` (`ok`, `error` or
        `store_unavailable`). The selector's value is not written: the
        entry used to carry `user_id`, `email` and `tckn_hash`, and entries
        written by earlier versions still do.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - required: [user_id]
                  properties:
                    user_id: { type: string }
                - required: [email]
                  properties:
                    email: { type: string, format: email }
                - required: [tckn_hash]
