          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          description: Key not found
        "503":
          description: API keys store unavailable

