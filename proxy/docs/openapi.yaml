          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        "400":
          description: Name is required
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          description: Entity not found
        "409":
          description: |
            `dual_control_required`: removing an entity rewrites the policy, so
            under dual control it goes through a proposal. Audited as
            `policy.custom_entity.delete`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyWriteRefused"
        "500":
          description: Policy store unavailable

  /api/v1/policies/history:
    get:
      tags: [policies]
      summary: List policy revisions
      x-required-role: viewer
      x-required-permission: "read"
      description: |
        Policy text is masked for callers below admin as described under
        `GET /api/v1/policies`: a literal `notify[].webhook` URL is cut to
        scheme and host followed by `***masked***`, and the response then
        carries `X-Tamga-Masked: notify.webhook`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyRevision"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /api/v1/policies/revisions/{id}:
    get:
      tags: [policies]
      summary: Get a single policy revision
      x-required-role: viewer
      x-required-permission: "read"
      description: |
        Policy text is masked for callers below admin as described under
        `GET /api/v1/policies`: a literal `notify[].webhook` URL is cut to
        scheme and host followed by `***masked***`, and the response then
        carries `X-Tamga-Masked: notify.webhook`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRevision"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          description: Revision not found

  /api/v1/policies/rollback/{id}:
    post:
      tags: [policies]
      summary: Roll back to a previous policy revision
      x-required-role: admin
      x-required-permission: "policies:admin"
      description: |
        Admin role only. A rollback is a direct write: under dual control it
        is refused with 409 `dual_control_required`, and the revision's text
        goes into a proposal instead.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  revision: { type: string }
        "400":
          description: History not configured
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          description: Revision not found
        "409":
          description: "`dual_control_required`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyWriteRefused"
        "422":
          description: The revision no longer loads as a policy

  /api/v1/policies/proposals:
    get:
      tags: [policies]
      summary: List policy proposals (open, approved and rejected)
      x-required-role: viewer
      x-required-permission: "read"
      description: |
        Policy text is masked for callers below admin as described under
        `GET /api/v1/policies`: a literal `notify[].webhook` URL is cut to
        scheme and host followed by `***masked***`, and the response then
        carries `X-Tamga-Masked: notify.webhook`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyProposal"
        "403":
          $ref: "#/components/responses/PermissionDenied"

    post:
      tags: [policies]
      summary: Create a policy proposal
      x-required-role: analyst
      x-required-permission: "policies:write"
      description: |
        Open to the admin and analyst roles. The proposal is a whole policy
        document. Its author is the caller's verified actor (see
        `PolicyProposal.author`); no header or body field can set it.

        The text is judged as a direct write would be: it must decode and
        validate, and an analyst's proposal may not change sections that
        need the admin role. It is judged again when it is approved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                message: { type: string }
                yaml: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyProposal"
        "400":
          description: History not configured, invalid JSON, empty policy, or text that does not decode as a policy
        "403":
          description: The proposal touches sections that need the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyPrivilegeError"
        "422":
          description: The policy decodes but is refused, one issue per field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyValidationError"

  /api/v1/policies/proposals/{id}/approve:
    post:
      tags: [policies]
      summary: Approve an open proposal and apply it
      x-required-role: analyst
      x-required-permission: "policies:write"
      description: |
        Applies the stored text of the proposal; the request body is not
        read. Everything is checked at the moment of approval, against the
        policy then active:

        - the proposal must still be open (409 `proposal_closed`);
        - while `governance.require_dual_control` is on, the approver must
          be a different verified actor than the author (403
          `self_approval`). Every caller of the static admin key is the
          actor `admin-key`, so dual control cannot be satisfied with that
          key alone: each person needs their own API key or sign-in;
        - the policy must not have changed since the proposal was written
          (409 `proposal_stale`): a proposal replaces the whole policy, so
          approving an old one would undo the newer change. Reject it and
          open a new one;
        - the text must still decode and validate (400 / 422);
        - an analyst cannot approve a proposal that changes sections that
          need the admin role (403 `admin_role_required`).

        Without dual control an author may approve their own proposal.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approved and applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  revision_id: { type: string }
                  changed:
                    $ref: "#/components/schemas/PolicyChangedPaths"
        "400":
          description: History not configured, or the stored text no longer decodes as a policy
        "403":
          description: |
            `self_approval` (body `PolicyWriteRefused`) or
            `admin_role_required` (body `PolicyPrivilegeError`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PolicyWriteRefused"
                  - $ref: "#/components/schemas/PolicyPrivilegeError"
        "404":
          description: Proposal not found
        "409":
          description: |
            `proposal_closed` (already approved or rejected; `status` says which),
            `proposal_stale`, or `policy_read_only`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyWriteRefused"
        "422":
          description: The stored text decodes but is refused today, one issue per field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyValidationError"

  /api/v1/policies/proposals/{id}/reject:
    post:
      tags: [policies]
      summary: Reject an open proposal
      x-required-role: analyst
      x-required-permission: "policies:write"
      description: |
        The author may always withdraw their own proposal. Anyone else needs
        the role that could have approved it: an analyst cannot reject a
        proposal that changes sections that need the admin role.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyProposal"
        "400":
          description: History not configured
        "403":
          description: "`admin_role_required`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyPrivilegeError"
        "404":
          description: Proposal not found
        "409":
          description: "`proposal_closed`: already approved or rejected."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyWriteRefused"

  # ────────────────────────────────────────────────────────────────────
  # API Keys
  # ────────────────────────────────────────────────────────────────────
  /api/v1/apikeys:
    get:
      tags: [apikeys]
      summary: List scoped API keys (prefix only, raw key not returned)
      x-required-role: admin
      x-required-permission: "apikeys:read"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
                  total: { type: integer }
        "403":
          $ref: "#/components/responses/PermissionDenied"

    post:
      tags: [apikeys]
      summary: Create a new scoped API key
      x-required-role: admin
      x-required-permission: "apikeys:write"
      description: |
        `scope` defaults to `read`. The response carries `raw_key`, which is
        shown only this once; the server keeps a hash.

        `read`, `write` and `admin` open the management API. `proxy`
        identifies an application on the proxy path and is refused here.
        `org_id`, `role` and `user_id` are the identity a request made with
        the key has on the proxy path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
                scope:
                  type: string
                  enum: [read, write, admin, proxy]
                  default: read
                org_id: { type: string }
                role: { type: string }
                user_id: { type: string }
                expires_in_days:
                  type: integer
                  minimum: 0
                  description: 0 or absent means the key does not expire
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          description: Invalid scope or label
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "503":
          description: API keys store unavailable

