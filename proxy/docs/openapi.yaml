    # ── Events ────────────────────────────────────────────────────────

    SecurityFinding:
      type: object
      properties:
        type: { type: string }
        severity: { type: string }
        match: { type: string }
        category: { type: string }
        start_pos:
          type: integer
          description: Offset in the text of the segment at `path`; in the raw body when `path` is empty.
        end_pos: { type: integer }
        role:
          type: string
          description: Who the text speaks for (system, user, assistant, tool, tool_definition, request). Empty for a raw scan.
        path:
          type: string
          description: Location of the text in the request body, e.g. messages[2].content[0].text.
        confidence: { type: number }
        action_taken: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        scanner_version: { type: string }
        dataset_version: { type: string }

    SecurityEvent:
      type: object
      properties:
        request_id: { type: string }
        provider: { type: string }
        model: { type: string }
        event_type: { type: string }
        action: { type: string }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/SecurityFinding"
        findings_count: { type: integer }
        endpoint: { type: string }
        scan_latency_ms: { type: number }
        total_latency_ms: { type: number }
        content_type: { type: string }
        timestamp: { type: string, format: date-time }
        input_risk_pct: { type: integer }
        risk_level: { type: string }
        input_tokens:
          type: integer
          description: Absent when the proxy did not read the provider's usage.
        output_tokens:
          type: integer
          description: Absent when the proxy did not read the provider's usage.
        cost_usd:
          type: number
          description: What the request was charged; 0 for a cache hit. Absent when not known.
        cache_status:
          type: string
          enum: [hit, miss, bypass]
          description: Absent when the response cache is off.
        output_action:
          type: string
          description: The action taken on the response. Absent when nothing was decided about it.
        policy_name: { type: string }
        policy_version: { type: string }

    SecurityEventDetail:
      type: object
      properties:
        request_id: { type: string }
        timestamp: { type: string, format: date-time }
        provider: { type: string }
        model: { type: string }
        action: { type: string }
        event_type: { type: string }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/SecurityFinding"
        scan_latency_ms:
          type: number
          description: Milliseconds, with a fraction.
        total_latency_ms:
          type: number
          description: Milliseconds, with a fraction.
        policy_name:
          type: string
          description: The policy the request was decided with.
        policy_version: { type: string }
        input_tokens:
          type: integer
          description: Absent when not known; never a zero standing in for an unknown count.
        output_tokens:
          type: integer
          description: Absent when not known.
        cost_usd:
          type: number
          description: What the request was charged; 0 for a cache hit. Absent when not known.
        cache_status:
          type: string
          enum: [hit, miss, bypass]
        output_action:
          type: string
          description: The action taken on the response.
        output_findings:
          type: array
          description: What the scan of the response found, masked as `findings` are. Empty when it was scanned and clean; absent when it was not scanned.
          items:
            $ref: "#/components/schemas/SecurityFinding"
        output_risk:
          type: object
          description: The risk of the response as the proxy scored it. Absent when the response was not scanned.
        endpoint: { type: string }

    # ── Timeseries ────────────────────────────────────────────────────

    TimeseriesPoint:
      type: object
      properties:
        t: { type: string, format: date-time }
        total: { type: integer }
        blocked: { type: integer }
        redacted: { type: integer }
        warned: { type: integer }
        scan_p95: { type: number }

    TimeseriesResponse:
      type: object
      properties:
        range: { type: string }
        bucket: { type: string, enum: [hour, day] }
        points:
          type: array
          items:
            $ref: "#/components/schemas/TimeseriesPoint"

    # ── Findings ──────────────────────────────────────────────────────

    BreakdownResponse:
      type: object
      properties:
        range: { type: string }
        by_type:
          type: object
          additionalProperties: { type: integer }
        by_category:
          type: object
          additionalProperties: { type: integer }
        by_severity:
          type: object
          additionalProperties: { type: integer }
        type_by_category:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: integer }

    # ── Incidents ─────────────────────────────────────────────────────

    IncidentStatus:
      type: string
      enum: [Open, "In Progress", Closed, "False Positive"]

    IncidentState:
      type: object
      properties:
        request_id: { type: string }
        status:
          $ref: "#/components/schemas/IncidentStatus"
        assignee: { type: string }
        reason: { type: string }
        tags:
          type: array
          items:
            type: string
        comments:
          type: array
          items:
            type: object
            properties:
              author: { type: string }
              text: { type: string }
              created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        triaged_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        resolution: { type: string }

    IncidentPatch:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/IncidentStatus"
        assignee: { type: string }
        reason: { type: string }
        tags:
          type: array
          items:
            type: string
        add_comment:
          type: object
          properties:
            author: { type: string }
            text: { type: string }

    # ── MTTR ──────────────────────────────────────────────────────────

    MTTRStats:
      type: object
      properties:
        overall_mttr_minutes: { type: number }
        by_severity:
          type: object
          additionalProperties: { type: number }
        trend:
          type: string
          enum: [improving, stable, worsening]
        sla_compliance: { type: number }

    # ── Audit ─────────────────────────────────────────────────────────

    AuditEntry:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        actor:
          $ref: "#/components/schemas/VerifiedActor"
        kind:
          type: string
          description: |
            A change of the policy is one of `policy.put`, `policy.reload`,
            `policy.rollback`, `policy.proposal.approve`,
            `policy.custom_entity.add`, `policy.custom_entity.delete` or
            `policy.file_change` (the file was changed on disk; no actor).

            A management request that presented a credential and was refused
            is `auth.refused`. It is written for the first refusal of a
            source address for a reason; the refusals of that source for
            that reason in the 60 seconds that follow are counted, and one
            `auth.refused.repeated` entry says how many there were. 32
            pairs of source and reason are followed at a time, and the
            refusals of any further source are counted together in one
            `auth.refused.repeated` entry, so refusals add at most 65
            entries a minute. A request with no credential at all is not
            recorded, nor is the check `GET /api/v1/health/detailed` makes
            of a key.
          example: "auth.refused"
        target:
          type: string
          description: |
            What the entry is about. For `auth.refused`: the route that
            matched, as `METHOD /path/{id}`, or the method and path as sent
            when the request was refused before a route was chosen (at most
            160 characters, anything but printable ASCII replaced by `?`).
            Absent on `auth.refused.repeated`.
          example: "GET /api/v1/apikeys"
        detail:
          type: object
          description: |
            For `auth.refused`: `reason`, `source` (the address the request
            came from, by the rules of `TAMGA_TRUSTED_PROXIES`), `status`
            (the HTTP status answered) and, for `permission_denied`, `role`
            and `required_permission` (absent when the route declares
            none). `reason` is one of:

            - `invalid_key`: `X-Tamga-Admin-Key` was sent and is neither the
              admin key nor a live API key (401)
            - `invalid_token`: a bearer token that is malformed or not
              signed by this deployment (401)
            - `token_expired`: a bearer token of this deployment, past its
              expiry (401)
            - `session_revoked`: a valid token whose sessions were ended
              (401)
            - `account_not_assigned`: a valid token of an account without a
              role (403)
            - `proxy_key`: a live key of scope `proxy`, which opens nothing
              on the management API (403)
            - `permission_denied`: a role without the permission the route
              asks for (403)

            The actor is `anonymous` for the first three, and the key or
            the user that was verified for the others.

            For `auth.refused.repeated`: `repeats` (how many further
            refusals), `window_seconds`, and the `reason` and `source` they
            share; or, for the sources that were not followed one by one,
            `sources: "not followed individually"` in place of both.

            The credential that was presented is never recorded: not the
            key or the token, not a part, a hash or the length of it.

            For a change of the policy: `source` (`api_put`, `reload`,
            `rollback`, `proposal_approve`, `custom_entity_add`,
            `custom_entity_delete`, `file_watcher`), `changed`
            (`PolicyChangedPaths`), `sections` (the top-level sections
            touched), `rules` (the names of the rules touched), `version`
            and `revision_id`. Paths and names only; no value of the policy
            is written to the audit log.
          additionalProperties: true

    AuditChainResult:
      type: object
      properties:
        chain_ok: { type: boolean }
        entries: { type: integer }
        broken_at:
          type: integer
          nullable: true

    # ── Policies ──────────────────────────────────────────────────────

    TamgaPolicy:
      type: object
      description: Active policy document
      properties:
        name: { type: string }
        version: { type: string }
        # Additional fields vary per policy definition

    PolicyPutBody:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
          description: Policy YAML veya JSON metni

    PolicyValidateOK:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean, enum: [true] }
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PolicyValidationIssue"

    PolicyValidationIssue:
      type: object
      properties:
        field: { type: string }
        rule: { type: string }
        message: { type: string }
        severity: { type: string, enum: [error, warning] }

    PolicyValidationError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string }
            details:
              type: array
              items:
                $ref: "#/components/schemas/PolicyValidationIssue"

    PolicySimulateFinding:
      type: object
      properties:
        type: { type: string }
        category: { type: string }
        severity: { type: string }
        match: { type: string }
        confidence: { type: number }
        action: { type: string }

    PolicySimulateResult:
      type: object
      properties:
        policy_name: { type: string }
        policy_version: { type: string }
        action: { type: string }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/PolicySimulateFinding"

    ScanRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: Text to scan
        role:
          type: string
          enum: [system, user, assistant, tool]
          default: user
          description: Who the text speaks for. Rules with applies_to are matched against it.

    ScanFinding:
      type: object
      required: [type, category, severity, action]
      properties:
        type: { type: string }
        category: { type: string }
        severity:
          type: string
          enum: [critical, high, medium, low]
        start:
          type: integer
          description: |
            Byte offset into the text as UTF-8 where the finding begins.
            Absent with `end` for injection, jailbreak, content moderation
            and classifier findings, and for a value seen only in a
            normalised view of the text.
        end:
          type: integer
          description: Byte offset just past the finding
        action:
          type: string
          enum: [PASS, WARN, REDACT, STRIP, BLOCK]
          description: What the policy does about this finding on its own

    ScanResult:
      type: object
      required: [action, findings, policy, scan_latency_ms]
      properties:
        action:
          type: string
          enum: [PASS, WARN, REDACT, STRIP, BLOCK]
          description: The strictest action among the findings. LOG is reported as PASS.
        findings:
          type: array
          description: Always an array. The matched text is never included.
          items:
            $ref: "#/components/schemas/ScanFinding"
        redacted_text:
          type: string
          description: The text as the proxy would forward it. Present only when action is REDACT.
        policy:
          type: object
          required: [name, version]
          properties:
            name: { type: string }
            version: { type: string }
        scan_latency_ms: { type: number }

    LiteLLMGuardrailRequest:
      type: object
      description: |
        LiteLLM's GenericGuardrailAPIRequest. The fields listed are the
        ones read; the others LiteLLM sends (`images`, `request_data`,
        `request_headers`, `litellm_trace_id`, `litellm_version`,
        `additional_provider_specific_params`) are accepted and ignored.
      required: [input_type]
      additionalProperties: true
      properties:
        input_type:
          type: string
          enum: [request, response]
          description: Whether the texts are a request's or an answer's
        texts:
          type: array
          nullable: true
          maxItems: 256
          items: { type: string }
          description: The texts to scan. Empty ones are skipped. Texts, tools and tool calls are 262144 bytes at most in total.
        tools:
          type: array
          nullable: true
          maxItems: 256
          items:
            type: object
            additionalProperties: true
          description: |
            The request's tool definitions, in OpenAI's shape. Every string
            in one but its `type` is scanned in the role `tool_definition`.
            Not read when `input_type` is `response`.
        tool_calls:
          type: array
          nullable: true
          maxItems: 256
          items:
            type: object
            additionalProperties: true
          description: |
            The tool calls of the conversation or of the answer, in OpenAI's
            shape. The strings in their arguments are scanned in the role
            `assistant`. They are never rewritten.
        model:
          type: string
          nullable: true
          description: Recorded with the call when it is made of the characters model names are made of (letters, digits and `._:/@+-`, 128 at most). Decides nothing.
        structured_messages:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
          description: |
            The conversation in OpenAI's shape. When its texts, in order,
            are exactly `texts`, each text is scanned in the role of its
            message; otherwise every text is scanned as the user's.
        litellm_call_id:
          type: string
          nullable: true
          description: Logged with the call, shortened to 64 bytes

    LiteLLMGuardrailResponse:
      type: object
      description: Fields of LiteLLM's GenericGuardrailAPIResponse. No other field is sent.
      required: [action]
      properties:
        action:
          type: string
          enum: [NONE, BLOCKED, GUARDRAIL_INTERVENED]
        blocked_reason:
          type: string
          description: Present only with BLOCKED. Names the kinds of finding and the Tamga request id; holds nothing of what was matched.
        texts:
          type: array
          items: { type: string }
          description: Present only with GUARDRAIL_INTERVENED. One text for each one received, in the same order.
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
          description: |
            Present only with GUARDRAIL_INTERVENED, and only when a tool
            definition was masked or stripped: every tool received, in the
            same order. LiteLLM keeps its own tools when it is absent.

    LiteLLMGuardrailError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                `tamga_scan_unavailable`, `tamga_scan_busy`,
                `tamga_unauthorized`, `tamga_origin_refused`,
                `tamga_rate_limited`, `tamga_unsupported_media_type`,
                `tamga_too_large` or `tamga_invalid`
            message: { type: string }
            request_id: { type: string }

    CustomEntity:
      type: object
      properties:
        name: { type: string }
        pattern: { type: string }
        description: { type: string }
        severity:
          type: string
          enum: [critical, high, medium, low]
        action: { type: string }
        confidence: { type: number }

    PolicyRevision:
      type: object
      properties:
        id: { type: string }
        author: { type: string }
        message: { type: string }
        yaml: { type: string }
        actor: { type: string }
        created_at: { type: string, format: date-time }
        summary: { type: string }
        policy_yaml: { type: string }

    PolicyProposal:
      type: object
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        author:
          $ref: "#/components/schemas/VerifiedActor"
        message: { type: string }
        yaml: { type: string }
        status:
          type: string
          enum: [open, approved, rejected]
        approved_by:
          $ref: "#/components/schemas/VerifiedActor"
        approved_at: { type: string, format: date-time }
        rejected_by:
          $ref: "#/components/schemas/VerifiedActor"
        rejected_at: { type: string, format: date-time }

    VerifiedActor:
      type: string
      description: |
        Who a management request was authenticated as. The server derives it
        from the credential; headers such as `X-Tamga-Actor` or
        `X-Tamga-User-Id` and body fields such as `author` are not read.

        - `admin-key`: the static admin key. One shared secret, so every
          holder is the same actor.
        - `apikey:<id>`: a scoped API key, by the id of its record
          (`GET /api/v1/apikeys`), never its secret or its label.
        - `user:<subject>`: a signed-in user, by the subject of the verified
          session token.
        - `dev-mode`: dev mode, where no credential is asked for.
        - `anonymous`: `auth.refused` entries only, for a request whose
          credential matched nothing.
        - `policy-file`: history revisions only, for a change of the policy
          file on disk. Its audit entry has no actor.
      example: "apikey:key_3f0c2d1e4b6a9a55"

    PolicyChangedPaths:
      type: array
      description: |
        What a write changed, by path and never by value: a key of a section
        (`providers.allowed`), a key of a rule (`rules.pii_detection.action`),
        an entry of a named list (`custom_entities.EMPLOYEE_ID`), or the
        section itself. Empty when the decoded policy is the same.
      items: { type: string }
      example: ["rules.pii_detection.action", "vault.enabled"]

    PolicyWriteRefused:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: A sentence for a person. }
        code:
          type: string
          enum: [dual_control_required, self_approval, proposal_closed, proposal_stale, policy_read_only]
        status:
          type: string
          enum: [approved, rejected]
          description: With `proposal_closed`, what the proposal already is.

    SessionsUnavailable:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [sessions_unavailable, github_oauth_not_configured] }

    ReportError:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: A sentence for the console to show. }
        code:
          type: string
          enum:
            - invalid_range
            - report_counts_unavailable
            - analyzer_not_configured
            - analyzer_unavailable
            - analyzer_timeout
            - analyzer_error

    ReportPdfUnavailable:
      type: object
      properties:
        error: { type: string, example: "PDF generation unavailable: ReportLab not installed" }
        available: { type: boolean, enum: [false] }

    SSOSettings:
      type: object
      properties:
        provider_type: { type: string, enum: ["", saml, oidc] }
        metadata_url: { type: string, description: "Empty, or an http(s) URL with a host." }
        attribute_mapping:
          type: object
          additionalProperties: { type: string }
        enabled: { type: boolean }
        domain: { type: string, description: "Empty, or a domain such as example.com, without scheme or path." }

    PermissionDenied:
      type: object
      required: [error, code]
      properties:
        error: { type: string, example: "role viewer lacks incidents:write" }
        code: { type: string, enum: [permission_denied] }
        required_permission:
          type: string
          description: The permission the route asks for. Absent when the route itself has none declared, which is refused to every caller.
          example: "incidents:write"

    AccountNotAssigned:
      type: object
      required: [error, code, user_id]
      properties:
        error: { type: string }
        code: { type: string, enum: [account_not_assigned] }
        user_id:
          type: string
          description: The id an admin assigns a role to with `PUT /api/v1/team/{id}/role`.
        provider:
          type: string
          description: The identity provider of a refused sign-in (`github`). Absent on a refused session token.
        github_user_id:
          type: string
          description: The same id, under the name it had before `user_id`. GitHub sign-in only.

    SessionRevoked:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [session_revoked]
          description: Absent when the token is missing, invalid or expired.

    PolicyPrivilegeError:
      type: object
      required: [error, code, privileged_sections]
      properties:
        error: { type: string }
        code: { type: string, enum: [admin_role_required] }
        privileged_sections:
          type: array
          description: |
            The sections the change touches that need the admin role: a
            top-level section (`providers`, `exceptions`, `governance`,
            `data`, `pricing`, `vault`, `cache`, `body_limits`, `rate_limit`,
            `cost`, `scan`, `operator_state`, `canary`, and any section
            added later) or `rules.<name>.notify`.
          items: { type: string }
          example: ["providers", "rules.pii_detection.notify"]

    # ── API Keys ──────────────────────────────────────────────────────

    ApiKey:
      type: object
      properties:
        id:
          type: string
          description: |
            The id of the record: `key_` and 16 random hex characters, drawn
            apart from the key. It names the key in audit entries
            (`apikey:<id>`) and in the proxy's log. A key created before
            ids were drawn this way keeps the id it had, 12 hex characters
            that are the start of the key itself; revoke it and create
            another to get an id that says nothing about the key.
          example: "key_3f0c2d1e4b6a9a55"
        label: { type: string }
        scope:
          type: string
          enum: [read, write, admin, proxy]
        prefix:
          type: string
          description: |
            The first 8 characters of the key (`tk_` and five hex
            characters, 20 of its 192 random bits), for telling which key a
            row is. It is returned here and nowhere else.
          example: "tk_a8f2c"
        org_id: { type: string }
        role: { type: string }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used: { type: string, format: date-time }

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [raw_key]
          properties:
            raw_key: { type: string }

    # ── Webhooks ──────────────────────────────────────────────────────

    WebhookKind:
      type: string
      enum:
        - slack
        - teams
        - splunk
        - splunk_hec
        - sentinel
        - qradar
        - datadog
        - jira
        - pagerduty
        - opsgenie
        - servicenow
        - generic

    Webhook:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        kind:
          $ref: "#/components/schemas/WebhookKind"
        url: { type: string }
        enabled: { type: boolean }
        rule:
          type: object
          properties:
            blocks_per_minute: { type: integer }
            severity_at_least: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        payload_template: { type: string }
        project_key: { type: string }
        issue_type: { type: string }
        auth_token: { type: string, description: Returned by create only; never in the list. }
        has_auth_token: { type: boolean, description: In the list only. }
        url_redacted: { type: boolean, description: In the list only. True when `url` was cut to its scheme and host. }
        created_at: { type: string, format: date-time }
        last_fired: { type: string, format: date-time }

    WebhookCreate:
      type: object
      required: [label, kind, url]
      properties:
        label: { type: string }
        kind:
          $ref: "#/components/schemas/WebhookKind"
        url: { type: string }
        enabled: { type: boolean }
        rule:
          type: object
          properties:
            blocks_per_minute: { type: integer }
            severity_at_least: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        payload_template: { type: string }
        project_key: { type: string }
        issue_type: { type: string }
        auth_token: { type: string }

    # ── Metrics ───────────────────────────────────────────────────────

    HistogramBucket:
      type: object
      properties:
        le: { type: number }
        cumulative: { type: integer }

    HistogramMetric:
      type: object
      properties:
        name: { type: string }
        help: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        count: { type: integer }
        sum: { type: number }
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/HistogramBucket"

    # ── Patterns ──────────────────────────────────────────────────────

    PatternKind:
      type: string
      enum: [regex, literal]

    PatternSeverity:
      type: string
      enum: [low, medium, high, critical]

    CustomPattern:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          $ref: "#/components/schemas/PatternKind"
        pattern: { type: string }
        severity:
          $ref: "#/components/schemas/PatternSeverity"
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CustomPatternCreate:
      type: object
      required: [name, kind, pattern, severity]
      properties:
        name: { type: string }
        kind:
          $ref: "#/components/schemas/PatternKind"
        pattern: { type: string }
        severity:
          $ref: "#/components/schemas/PatternSeverity"
        enabled: { type: boolean }

    CustomPatternUpdate:
      type: object
      properties:
        name: { type: string }
        kind:
          $ref: "#/components/schemas/PatternKind"
        pattern: { type: string }
        severity:
          $ref: "#/components/schemas/PatternSeverity"
        enabled: { type: boolean }

    # ── Saved Hunts ───────────────────────────────────────────────────

    SavedHunt:
      type: object
      properties:
        id: { type: string }
        org_id: { type: string }
        name: { type: string }
        query: { type: object }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Team ──────────────────────────────────────────────────────────

    TeamRole:
      type: string
      enum: [admin, analyst, viewer]

    TeamMember:
      type: object
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        image_url: { type: string }
        role:
          description: The role the account has now. Empty for an account that nobody assigned a role, or whose role was removed, and that gets none by default.
          oneOf:
            - $ref: "#/components/schemas/TeamRole"
            - type: string
              enum: [""]
        assigned:
          type: boolean
          description: True when an admin gave this account the role shown. False when the role is only `default_role`, the one of accounts without an assignment, or when the account has no access. Always present.
        role_removed:
          type: boolean
          description: True when the account had a role and an admin removed it. Absent otherwise.
        updated_at:
          type: string
          format: date-time
          description: When the role was last assigned or removed. The zero time (`0001-01-01T00:00:00Z`) for an account without a record.
        sessions_valid_from:
          type: integer
          format: int64
          description: Unix seconds up to which the user's session tokens are revoked. Absent when nothing was revoked.

    # ── Billing ───────────────────────────────────────────────────────

    ModelPricing:
      type: object
      properties:
        id: { type: integer }
        provider: { type: string }
        model_family: { type: string }
        model_version: { type: string }
        input_per_1k: { type: number }
        output_per_1k: { type: number }
        currency: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time }
        source: { type: string }
        notes: { type: string }

    DailyCostRow:
      type: object
      properties:
        date: { type: string }
        provider: { type: string }
        model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_usd: { type: number }
        priced:
          type: boolean
          description: False when the model has no price; cost_usd is then 0 and means "unknown".

    UnpricedModel:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        tokens: { type: integer }

    CostBreakdownRow:
      type: object
      properties:
        provider: { type: string }
        model:
          type: string
          description: The model name as the client sent it.
        priced:
          type: boolean
          description: False when the model has no price; the cost fields are then 0 and mean "unknown".
        model_family: { type: string }
        model_version: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        input_cost: { type: number }
        output_cost: { type: number }
        total_cost: { type: number }
        currency: { type: string }
        pricing_id: { type: integer }

    # ── Budget ────────────────────────────────────────────────────────

    BudgetStats:
      type: object
      properties:
        org_id: { type: string }
        day: { type: string }
        tokens_today: { type: integer }
        cost_today_usd: { type: number }
        limit_tokens: { type: integer }
        limit_cost_usd: { type: number }
        note: { type: string }

    # ── Providers ─────────────────────────────────────────────────────

    ProviderModelEntry:
      type: object
      properties:
        id:
          type: string
          description: A model name seen in recent traffic on this route.
        requests: { type: integer }
        priced:
          type: boolean
          description: False when the model has no price; input_usd and output_usd are then absent.
        input_usd: { type: number }
        output_usd: { type: number }

    ProviderCatalogEntry:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        path: { type: string }
        usage: { type: boolean }
        streaming: { type: boolean }
        models:
          type: array
          items:
            $ref: "#/components/schemas/ProviderModelEntry"
