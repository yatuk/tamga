  # ────────────────────────────────────────────────────────────────────
  # Policies
  # ────────────────────────────────────────────────────────────────────
  /api/v1/policies:
    get:
      tags: [policies]
      summary: Get active policy (returns array for dashboard compatibility)
      x-required-role: viewer
      x-required-permission: "read"
      description: |
        A rule's `notify[].webhook` is either a reference to an environment
        variable (`${SLACK_WEBHOOK_URL}`) or the URL itself, and such a URL
        is a credential. An admin reads it as it is. Every other caller gets
        scheme and host followed by `***masked***`
        (`https://hooks.slack.com/***masked***`), in the structured policy
        and in any policy text (`yaml`), comments included; a reference is
        never changed. A response in which something was masked carries the
        header `X-Tamga-Masked: notify.webhook`.

        Masked text cannot be written back: `PUT /api/v1/policies` and
        `POST /api/v1/policies/proposals` answer 422 `masked_value` to a
        policy that holds the mask in a webhook, from any role.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TamgaPolicy"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "500":
          description: Policy store unavailable

    put:
      tags: [policies]
      summary: Overwrite the on-disk policy YAML and reload
      x-required-role: analyst
      x-required-permission: "policies:write"
      description: |
        A direct write. It is refused with 409 `dual_control_required` while
        `governance.require_dual_control` is on in the active policy: open a
        proposal instead. That includes the write that would turn dual
        control off.

        The admin role may change every section. The analyst role (an API key
        of scope `write`) may change `rules` (except a rule's `notify`),
        `output_rules`, `custom_entities`, `competitors`, `name` and
        `version`; anything else is refused with 403 `admin_role_required`
        and the sections are named in `privileged_sections`. The submitted
        policy is compared with the active one as decoded values, so the
        order of keys, comments and quoting are not changes.

        A successful write is appended to the policy history and to the audit
        log (`policy.put`) with the caller's verified actor and the paths
        that changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyPutBody"
          text/yaml:
            schema:
              type: string
              description: Raw YAML policy document
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  name: { type: string }
                  version: { type: string }
                  changed:
                    $ref: "#/components/schemas/PolicyChangedPaths"
                  revision_id:
                    type: string
                    description: The history revision written for this policy. Absent when no history is configured.
        "400":
          description: Empty body, or text that does not decode as a policy (YAML syntax, an unknown key, a second document). The body is an object with one string, `error`.
        "403":
          description: The change touches sections that need the admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyPrivilegeError"
        "409":
          description: |
            `dual_control_required`: the active policy requires dual control and the policy cannot be written directly.
            `policy_read_only`: the policy file is read-only where the proxy runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyWriteRefused"
        "422":
          description: |
            The policy decodes but is refused: a semantic error, a value outside
            its bounds (a pattern past the limits, a negative quota, a body limit
            out of range) or a pool endpoint the upstream rules do not allow. One
            issue per field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyValidationError"

  /api/v1/policies/reload:
    post:
      tags: [policies]
      summary: Reload the policy from disk without changing content
      x-required-role: admin
      x-required-permission: "policies:admin"
      description: |
        Brings in whatever the policy file on disk holds. It is not a direct
        write and is not held back by dual control or the privilege split:
        the file was changed by someone with access to the host. Because it
        installs the sections only an admin may change along with the rest,
        it needs the admin role. The audit
        entry (`policy.reload`) carries the caller's verified actor and the
        paths that changed; a reload that changed the policy also appends a
        history revision.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  name: { type: string }
                  changed:
                    $ref: "#/components/schemas/PolicyChangedPaths"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "500":
          description: Policy store unavailable or reload failed

  /api/v1/policies/validate:
    post:
      tags: [policies]
      summary: Validate policy YAML/JSON without persisting (dry-run)
      x-required-role: analyst
      x-required-permission: "policies:write"
      description: |
        Gövde `PUT /api/v1/policies` ile aynıdır: ham YAML (`text/yaml`) veya
        JSON `{ "yaml": "..." }`. Sözdizimi + semantik kontrol; hata yoksa 200 ve
        uyarılar listesi, bloklayıcı hata varsa 422 ve `error.code=validation_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyPutBody"
      responses:
        "200":
          description: Policy geçerli (uyarılar olabilir)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyValidateOK"
        "400":
          description: Empty body, or text that does not decode as a policy (YAML syntax, an unknown key, a second document). The body is an object with one string, `error`.
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "422":
          description: |
            The policy decodes but is refused: a semantic error, a value outside
            its bounds or a pool endpoint the upstream rules do not allow. One
            issue per field, the same shape for all three.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyValidationError"

  /api/v1/policies/simulate:
    post:
      tags: [policies]
      summary: Dry-run scan against policy-supplied YAML and sample text
      x-required-role: analyst
      x-required-permission: "policies:write"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sample_text]
              properties:
                yaml:
                  type: string
                  description: Policy YAML (empty = use active policy)
                sample_text:
                  type: string
                  description: Text to scan
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySimulateResult"
        "400":
          description: Parse error or no policy to simulate
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /api/v1/scan:
    post:
      tags: [scan]
      summary: Policy verdict for a text, without calling a provider
      description: |
        Runs the active policy over one piece of text and returns what the
        proxy path would do with a message carrying that text in that role.
        Nothing is forwarded and nothing is stored: no event, no audit log
        entry, no request record, no vault entry. The call is counted and
        logged without the text.

        Authentication is this route's own. Send a Tamga key of any scope,
        `proxy` included, as `X-Tamga-Key`, or the admin key as
        `X-Tamga-Admin-Key`. Keys in the query string, sessions and dev mode
        do not open it. A request from a web page (an `http` or `https`
        `Origin`) is refused unless the origin is on the CORS allowlist.

        Limits: 60 calls a minute per key unless the policy sets
        `rate_limit.max_requests_per_minute`, counted apart from the key's
        proxy requests and always refused when exceeded; a body of at most
        262144 bytes; a small number of scans at a time, answered 503 when
        all are in use.

        A 200 is a complete verdict. If any scanner or the inline classifier
        did not finish, the answer is 503, whatever `scan.on_error` says.
        A text longer than `scan.classifier.max_chars` is such a case when
        the classifier is on, for a verdict of PASS or WARN. A verdict that
        already stops or rewrites the text (BLOCK, STRIP, REDACT) is given,
        with the header `X-Tamga-Classifier: incomplete`.

        For a custom entity or a competitor, a `proxy` key gets `custom` or
        `competitor` as the category, not the name the operator chose.

        Where the verdict can differ from the proxy path:
        - An injection split over several messages of one role is found on
          the proxy path and not here, where the text is a single message.
        - Only input rules are applied. Text given the role `assistant` is
          not checked against `output_rules`.
        - With `vault.enabled` the proxy sends numbered placeholders and
          restores them in the response; `redacted_text` shows the plain
          `[category_REDACTED]` markers.
        - The `operator_state` scanner is not run.
        - The IP allowlist covers the proxy routes, not `/api/v1`.
      security:
        - TamgaKey: []
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "200":
          description: The verdict. BLOCK is a verdict, not an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        "400":
          description: Body is not unambiguous UTF-8 JSON, text is missing or empty, or role is not one of the four
        "401":
          description: No valid key
        "403":
          description: Request came from a web page whose origin is not on the CORS allowlist
        "413":
          description: Body over 262144 bytes
        "415":
          description: Content-Type is not application/json
        "429":
          description: Rate limit exceeded (Retry-After is set)
        "503":
          description: No verdict. The scan did not complete, the policy is not loaded, or every scan slot is in use (Retry-After is set)

  /api/v1/beta/litellm_basic_guardrail_api:
    post:
      tags: [scan]
      summary: The scan path, in the shape LiteLLM's Generic Guardrail API calls
      description: |
        A LiteLLM proxy with a `generic_guardrail_api` guardrail whose
        `api_base` is `https://<tamga>/api/v1` posts here: the texts, tool
        definitions and tool calls of a request before it calls the model
        (`input_type: request`), and the texts and tool calls of the answer
        afterwards (`input_type: response`). The path is LiteLLM's, which
        appends it to the `api_base`. Written against LiteLLM v1.104.2. See
        `docs/litellm.md`.

        It is an adapter over the scan path and decides nothing of its own.
        A request is scanned and judged as `POST /api/v1/scan` judges a
        text: its texts in their roles, its `tools` in the role
        `tool_definition`, and the arguments of its `tool_calls` in the role
        `assistant`, as the proxy reads the same request. An answer's texts
        and tool calls are judged by `output_rules`, as the proxy judges an
        answer, and pass when `output_rules` is off.

        Nothing is forwarded, and no text is stored or logged. Unlike a
        scan, a call is recorded as a request is: it appears in the request
        log and the live feed with the provider `litellm`, this path and
        the direction as its endpoint, the verdict, and the findings with
        their masked matches, and a block or a redaction fires the alerts.
        Every request call is recorded; an answer call is recorded when
        something was found or done. The vault is not used.

        The reply uses the three actions of the contract:
        - BLOCK, or a REDACT or STRIP that cannot be carried out:
          `BLOCKED`, with a `blocked_reason` that names the kinds of finding
          (`pii/tc_kimlik`) and the Tamga request id, never what was matched.
        - REDACT and STRIP: `GUARDRAIL_INTERVENED`, with `texts` holding
          one text for each one received, in the same order, masked with
          the proxy's `[category_REDACTED]` markers or replaced by its
          strip placeholder. When a tool definition was masked or stripped,
          `tools` holds every tool received, in the same order.
        - WARN, LOG and PASS: `NONE`.
        The policy's own action is in the `X-Tamga-Action` header.

        A value to mask or strip in a tool call's arguments cannot be
        returned (the contract's reply has no field for tool calls), and
        neither can a change to a tool's name: the reply is then `BLOCKED`,
        the reason says `REDACT could not be carried out (tool_call)` or
        `(tool_name)`, and `X-Tamga-Redact-Fallback` or
        `X-Tamga-Strip-Fallback` says `block:tool_call` or
        `block:tool_name`.

        A scan that did not run to the end is a 503 with the code
        `tamga_scan_unavailable`, never a reply with an action, whatever
        `scan.on_error` and `output_rules.fail_open` say. LiteLLM treats a
        503 as its guardrail being unreachable and stops the request unless
        it was configured to fail open.

        Authentication is the scan route's: a Tamga key of any scope, or the
        admin key as `X-Tamga-Admin-Key`. The key is also read from
        `x-api-key`, where LiteLLM sends a guardrail's `api_key`; the admin
        key is not read from there. Keys in the query string, sessions and
        dev mode do not open it, and a web page's request is refused as on
        the scan route.

        Limits: 600 calls a minute per key unless the policy sets
        `rate_limit.max_requests_per_minute`, counted apart from the key's
        scans and proxy requests; a body of at most 1048576 bytes; at most
        256 texts, 256 tools and 256 tool calls; at most 262144 bytes of
        what is scanned (the texts, and the tools and tool calls as sent);
        the scan route's slots, shared with it.

        `structured_messages` is read for the role of each text and for
        nothing else; without it every text is scanned as the user's.
        `images` are not read, as on the proxy path. `tools` are read on a
        request only. Nothing masked here can be restored: the vault is not
        used.
      security:
        - TamgaKey: []
        - LiteLLMKey: []
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiteLLMGuardrailRequest"
      responses:
        "200":
          description: The verdict. BLOCKED is a verdict, not an error.
          headers:
            X-Tamga-Action:
              description: The policy's action
              schema:
                type: string
                enum: [PASS, WARN, REDACT, STRIP, BLOCK]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiteLLMGuardrailResponse"
        "400":
          description: Body is not unambiguous UTF-8 JSON, input_type is missing or not one of the two, or texts, tools or tool_calls is not a list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiteLLMGuardrailError"
        "401":
          description: No valid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiteLLMGuardrailError"
        "403":
          description: Request came from a web page whose origin is not on the CORS allowlist
        "413":
          description: Body over 1048576 bytes, more than 256 texts, tools or tool calls, or more than 262144 bytes of texts, tools and tool calls together
        "415":
          description: Content-Type is not application/json
        "429":
          description: Rate limit exceeded (Retry-After is set)
        "503":
          description: |
            No verdict (Retry-After is set). `tamga_scan_unavailable`: the
            scan did not complete or the policy is not loaded.
            `tamga_scan_busy`: every scan slot is in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiteLLMGuardrailError"

  /api/v1/policies/custom-entities:
    get:
      tags: [policies]
      summary: List custom entities from the active policy
      x-required-role: viewer
      x-required-permission: "read"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomEntity"
                  total: { type: integer }
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "500":
          description: Policy store unavailable or no policy loaded

    post:
      tags: [policies]
      summary: Add a custom entity to the policy
      x-required-role: analyst
      x-required-permission: "policies:write"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomEntity"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  entity:
                    $ref: "#/components/schemas/CustomEntity"
        "400":
          description: Missing name/pattern or invalid regex
        "409":
          description: |
            Entity with this name already exists, or `dual_control_required`:
            adding an entity rewrites the policy, so under dual control it
            goes through a proposal. Audited as `policy.custom_entity.add`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyWriteRefused"

  /api/v1/policies/custom-entities/{name}:
    delete:
      tags: [policies]
      summary: Remove a custom entity by name and reload
      x-required-role: analyst
