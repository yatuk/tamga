<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tamga demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0f0c; --card: #1b1f19; --panel: #141712; --border: #343a31; --border-subtle: #262b24;
    --fg: #f1f1e8; --muted: #c0c5ba; --subtle: #92998d; --faint: #6a7066;
    --accent: #e25444; --redact: #e0b040; --ok: #55b98f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 820px; height: 460px; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: Barlow, system-ui, "Segoe UI", Arial, sans-serif; }
  .mono { font-family: "JetBrains Mono", Consolas, monospace; }
  .cond { font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; font-weight: 800; }
  #stage { position: absolute; inset: 0;
    background-image: radial-gradient(#1d211b 1px, transparent 1px); background-size: 20px 20px; background-position: 10px 10px; }
  .abs { position: absolute; }

  /* header */
  .top { left: 24px; right: 24px; top: 16px; height: 30px; display: flex; align-items: center; gap: 9px; }
  .top svg { width: 24px; height: 24px; }
  .brand { font-size: 20px; letter-spacing: 1.5px; }
  .tagline { margin-left: auto; font-size: 9px; letter-spacing: 1.5px; color: var(--faint); }
  .tagline b { color: var(--subtle); font-weight: 400; }

  /* scanners */
  #pills { left: 0; right: 0; top: 112px; display: flex; justify-content: center; gap: 8px; }
  .pill { width: 92px; height: 22px; border: 1px solid var(--border); background: var(--panel); font-size: 9.5px;
    letter-spacing: .6px; color: var(--faint); display: flex; align-items: center; gap: 6px; padding: 0 8px; }
  .pill i { width: 6px; height: 6px; background: var(--border); display: block; }
  #gatelogo { left: 386px; top: 54px; width: 48px; height: 48px; }

  /* pipeline */
  .node { top: 162px; width: 130px; height: 76px; border: 1px solid var(--border); background: var(--panel); padding: 11px 12px; }
  .node .t { font-size: 18px; letter-spacing: 1px; line-height: 1; }
  .node .d { font-size: 8.5px; color: var(--faint); margin-top: 6px; line-height: 13px; white-space: nowrap; }
  #nodeL { left: 24px; } #nodeR { left: 666px; }
  #track { left: 154px; width: 512px; top: 199px; height: 2px;
    background-image: linear-gradient(90deg, var(--border) 50%, transparent 50%); background-size: 10px 2px; }
  .corner { width: 12px; height: 12px; border: 0 solid var(--subtle); }
  #beam { top: 160px; width: 2px; height: 80px; background: var(--fg); }
  #beamTrail { top: 160px; height: 80px; width: 46px; background: linear-gradient(90deg, rgba(241,241,232,0), rgba(241,241,232,.13)); }

  #chip { left: 245px; top: 172px; width: 330px; height: 56px; background: var(--card); border: 1px solid var(--border);
    padding: 8px 14px; transform-origin: center; }
  #chip .lab { font-size: 8px; letter-spacing: 1.4px; color: var(--faint); }
  #chip .txt { font-size: 13px; margin-top: 5px; white-space: pre; color: var(--fg); }
  #back { top: 190px; height: 20px; padding: 0 7px; background: var(--accent); color: #150d0c; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; margin-left: -19px; }

  #verdict { left: 0; right: 0; top: 249px; display: flex; justify-content: center; align-items: center; gap: 10px; height: 26px; }
  #vtag { font-size: 17px; letter-spacing: 2px; padding: 1px 10px 2px; color: #150d0c; }
  #vwhy { font-size: 10.5px; color: var(--muted); }

  /* audit log */
  #log { left: 24px; right: 24px; top: 300px; height: 142px; border: 1px solid var(--border); background: var(--panel); overflow: hidden; }
  #log .h { height: 26px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px;
    font-size: 8.5px; letter-spacing: 1.5px; color: var(--faint); }
  #log .h .c { margin-left: auto; display: flex; gap: 16px; }
  #log .h .c b { color: var(--fg); font-weight: 500; }
  .line { position: absolute; left: 0; right: 0; height: 27px; display: grid; grid-template-columns: 66px 250px 44px 1fr;
    align-items: center; padding: 0 12px; font-size: 10.5px; color: var(--muted); border-bottom: 1px solid var(--border-subtle); }
  .line .a { font-weight: 700; letter-spacing: 1px; }

  /* end card */
  #end { inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #end svg { width: 70px; height: 70px; }
  #end h1 { font-size: 60px; line-height: 1; letter-spacing: 1.5px; margin-top: 18px; }
  #end h1 em { font-style: normal; color: var(--accent); }
  #end p { margin-top: 12px; font-size: 16px; color: var(--muted); }
  #end .url { margin-top: 16px; font-size: 11px; color: var(--subtle); letter-spacing: .6px; }
</style>
</head>
<body>
<div id="stage">
  <div class="abs top">
    <svg viewBox="0 0 64 64"><path fill="#f1f1e8" fill-rule="evenodd" d="M6 8h52v18H43v19.5L32 57 21 45.5V26H6V8Zm8 8v4h15v22.3l3 3.2 3-3.2V20h15v-4H14Z"/><rect x="29" y="20" width="6" height="24" fill="#e25444"/><rect x="6" y="31" width="8" height="5" fill="#e25444"/><rect x="50" y="31" width="8" height="5" fill="#e25444"/></svg>
    <div class="brand cond">TAMGA</div>
    <div class="tagline mono"><b>SELF-HOSTED</b> &nbsp;·&nbsp; <b>INLINE</b> &nbsp;·&nbsp; <b>AUDIT-LOGGED</b></div>
  </div>

  <svg id="gatelogo" class="abs" viewBox="0 0 64 64"><path id="gl-body" fill="#f1f1e8" fill-rule="evenodd" d="M6 8h52v18H43v19.5L32 57 21 45.5V26H6V8Zm8 8v4h15v22.3l3 3.2 3-3.2V20h15v-4H14Z"/><rect id="gl-a" x="29" y="20" width="6" height="24" fill="#e25444"/><rect id="gl-b" x="6" y="31" width="8" height="5" fill="#e25444"/><rect id="gl-c" x="50" y="31" width="8" height="5" fill="#e25444"/></svg>
  <div id="pills" class="abs mono">
    <div class="pill" id="p-pii"><i></i><span>pii</span></div>
    <div class="pill" id="p-secrets"><i></i><span>secrets</span></div>
    <div class="pill" id="p-injection"><i></i><span>injection</span></div>
  </div>

  <div id="nodeL" class="abs node"><div class="t cond">YOUR APP</div><div class="d mono">POST /v1/chat/<br/>completions</div></div>
  <div id="nodeR" class="abs node"><div class="t cond">PROVIDER</div><div class="d mono" id="rcv">received 0<br/>&nbsp;</div></div>
  <div id="track" class="abs"></div>

  <div class="abs corner" style="left:233px; top:160px; border-left-width:1px; border-top-width:1px;"></div>
  <div class="abs corner" style="left:575px; top:160px; border-right-width:1px; border-top-width:1px;"></div>
  <div class="abs corner" style="left:233px; top:228px; border-left-width:1px; border-bottom-width:1px;"></div>
  <div class="abs corner" style="left:575px; top:228px; border-right-width:1px; border-bottom-width:1px;"></div>

  <div id="chip" class="abs"><div class="lab mono">PROMPT</div><div class="txt mono" id="txt"></div></div>
  <div id="beamTrail" class="abs"></div><div id="beam" class="abs"></div>
  <div id="back" class="abs mono">403</div>

  <div id="verdict" class="abs"><div id="vtag" class="cond"></div><div id="vwhy" class="mono"></div></div>

  <div id="log" class="abs mono">
    <div class="h"><span>AUDIT LOG</span>
      <span class="c"><span>SCANNED <b id="c-s">0</b></span><span>REDACTED <b id="c-r">0</b></span><span>BLOCKED <b id="c-b">0</b></span></span>
    </div>
    <div id="lines"></div>
  </div>

  <div id="end" class="abs">
    <svg viewBox="0 0 64 64" id="endlogo"><path fill="#f1f1e8" fill-rule="evenodd" d="M6 8h52v18H43v19.5L32 57 21 45.5V26H6V8Zm8 8v4h15v22.3l3 3.2 3-3.2V20h15v-4H14Z"/><rect x="29" y="20" width="6" height="24" fill="#e25444"/><rect x="6" y="31" width="8" height="5" fill="#e25444"/><rect x="50" y="31" width="8" height="5" fill="#e25444"/></svg>
    <h1 class="cond" id="endh">INSPECT BEFORE <em>INGRESS.</em></h1>
    <p id="endp">Self-hosted security proxy for LLM traffic.</p>
    <div class="url mono" id="endu">github.com/yatuk/tamga &nbsp;·&nbsp; tamgaproxy.com</div>
  </div>
</div>

<script>
// Actions match the shipped default policy; the redaction token is what the proxy writes.
const SCENES = [
  { pre: 'Summarise the Q3 board notes', hit: '', post: '', scanner: null, action: 'PASS',
    why: 'no findings', log: ['PASS', '—', '200', 'forwarded'] },
  { pre: 'Invoice to ', hit: 'ayse.yilmaz@example.com', post: '', scanner: 'pii', action: 'REDACT', repl: '[email_REDACTED]',
    why: 'pii · email', log: ['REDACT', 'pii/email', '200', 'forwarded, address masked'] },
  { pre: 'Refund card ', hit: '4111 1111 1111 1111', post: '', scanner: 'pii', action: 'BLOCK',
    why: 'pii · credit_card', log: ['BLOCK', 'pii/credit_card', '403', 'never left your network'] },
  { pre: '', hit: 'Ignore all previous instructions', post: '', scanner: 'injection', action: 'BLOCK',
    why: 'injection · instruction_override', log: ['BLOCK', 'injection/instruction_override', '403', 'never reached the model'] },
];
const COLOR = { PASS: 'var(--ok)', REDACT: 'var(--redact)', BLOCK: 'var(--accent)' };
const SCENE_MS = 3100, END_MS = 2900;
const TOTAL_MS = SCENES.length * SCENE_MS + END_MS;
window.TOTAL_MS = TOTAL_MS;

const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const out3 = x => 1 - Math.pow(1 - x, 3);
const in3 = x => x * x * x;
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const GLYPHS = '#$%&*+=?@0123456789ABCDEFXZ';
const noise = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };

const CX = 410, LX = 89, RX = 731;          // chip centre stops
const CHIP_L = 245, CHIP_W = 330;
const PILLS = ['pii', 'secrets', 'injection'];

// beats within a scene (ms)
const B = { inA: 0, inB: 620, scanA: 680, scanB: 1500, verA: 1500, verB: 1820, outA: 1900, outB: 2520, logA: 2400, logB: 2700 };

function render(ms) {
  ms = ((ms % TOTAL_MS) + TOTAL_MS) % TOTAL_MS;
  const sceneTotal = SCENES.length * SCENE_MS;
  const endT = ms - sceneTotal;
  const i = Math.min(SCENES.length - 1, Math.floor(ms / SCENE_MS));
  const t = endT >= 0 ? SCENE_MS : ms - i * SCENE_MS;
  const sc = SCENES[i], col = COLOR[sc.action];
  const forwarded = sc.action !== 'BLOCK';

  $('track').style.backgroundPositionX = (ms / 40 % 10) + 'px';

  // ── chip position ──
  const pin = out3(prog(t, B.inA, B.inB));
  const pout = prog(t, B.outA, B.outB);
  let x = lerp(LX, CX, pin), y = 0, scale = lerp(.3, 1, pin), op = prog(t, B.inA, B.inA + 180), rot = 0;
  if (pout > 0) {
    if (forwarded) { const p = inOut(pout); x = lerp(CX, RX, p); scale = lerp(1, .3, p); op = 1 - prog(pout, .8, 1); }
    else {
      const shake = prog(t, B.outA, B.outA + 260);
      x = CX + (shake < 1 ? Math.sin(shake * Math.PI * 6) * 7 * (1 - shake) : 0);
      const fall = in3(prog(t, B.outA + 260, B.outB));
      y = fall * 46; rot = fall * 5; op = 1 - fall;
    }
  }
  const chip = $('chip');
  chip.style.transform = `translate(${x - CX}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
  chip.style.opacity = op;

  // ── scan beam + text ──
  const scan = prog(t, B.scanA, B.scanB);
  const scanning = scan > 0 && scan < 1;
  const bx = CHIP_L - 6 + inOut(scan) * (CHIP_W + 12);
  $('beam').style.left = bx + 'px'; $('beam').style.opacity = scanning ? 1 : 0;
  $('beamTrail').style.left = (bx - 46) + 'px'; $('beamTrail').style.opacity = scanning ? 1 : 0;

  const ver = prog(t, B.verA, B.verB);
  const full = sc.pre + sc.hit + sc.post;
  const textX0 = 14, charW = 7.8;                       // chip padding, 13px mono advance
  const beamChar = (bx - CHIP_L - textX0) / charW;      // how far the beam is, in characters
  let hitHtml = '';
  if (sc.hit) {
    let hit = sc.hit;
    if (sc.action === 'REDACT' && ver > 0) {            // scramble into the redaction token
      const len = Math.round(lerp(sc.hit.length, sc.repl.length, ver));
      const fixed = Math.floor(sc.repl.length * ver);
      hit = '';
      for (let k = 0; k < len; k++) hit += k < fixed ? sc.repl[k] : GLYPHS[Math.floor(noise(k, Math.floor(ms / 50)) * GLYPHS.length)];
    }
    const seen = scan >= 1 ? hit.length : clamp(Math.round(beamChar - sc.pre.length), 0, hit.length);
    const mark = `color:${col}; background: color-mix(in srgb, ${col} 22%, transparent);` +
      (sc.action === 'BLOCK' && ver > 0 ? 'text-decoration: line-through;' : '');
    hitHtml = `<span style="${mark}">${esc(hit.slice(0, seen))}</span>${esc(hit.slice(seen))}`;
  }
  $('txt').innerHTML = esc(sc.pre) + hitHtml + esc(sc.post);
  chip.style.borderColor = ver > 0 ? col : (scanning ? 'var(--subtle)' : 'var(--border)');
  chip.style.boxShadow = ver > 0 ? `0 0 0 ${3 * (1 - ver)}px color-mix(in srgb, ${col} 45%, transparent)` : 'none';

  // ── scanner pills ──
  PILLS.forEach((name, k) => {
    const el = $('p-' + name), dot = el.querySelector('i');
    const a = k / 3, b = (k + 1) / 3;
    let c = 'var(--border)', txt = 'var(--faint)', bd = 'var(--border)';
    if (scan > a && scan < b) { c = 'var(--fg)'; txt = 'var(--fg)'; bd = 'var(--subtle)'; }
    else if (scan >= b && t < B.outB + 300) {
      const fired = sc.scanner === name;
      c = fired ? col : 'var(--ok)'; txt = fired ? col : 'var(--subtle)'; bd = fired ? col : 'var(--border)';
    }
    dot.style.background = c; el.style.color = txt; el.style.borderColor = bd;
  });

  // ── gate logo: the seal presses down on a verdict ──
  const press = ver > 0 && ver < 1 ? Math.sin(ver * Math.PI) : 0;
  $('gatelogo').style.transform = `translateY(${press * 5}px) scale(${1 + press * .06})`;
  for (const id of ['gl-a', 'gl-b', 'gl-c']) $(id).setAttribute('fill', ver > 0 && t < B.outB ? `${sc.action === 'PASS' ? '#55b98f' : sc.action === 'REDACT' ? '#e0b040' : '#e25444'}` : '#e25444');

  // ── verdict tag ──
  const vp = prog(t, B.verA + 60, B.verA + 360), vout = prog(t, SCENE_MS - 260, SCENE_MS - 40);
  const vt = $('vtag');
  vt.textContent = sc.action; vt.style.background = col;
  $('vwhy').textContent = sc.why;
  $('verdict').style.opacity = endT >= 0 ? 0 : Math.min(vp * 3, 1) * (1 - vout);
  vt.style.transform = `scale(${lerp(.6, 1, back(vp))})`;

  // ── 403 travelling back / provider receiving ──
  const bp = forwarded ? 0 : prog(t, B.outA + 240, B.outB + 40);
  const bk = $('back');
  bk.style.left = lerp(CHIP_L - 28, LX + 88, inOut(bp)) + 'px';
  bk.style.opacity = bp > 0 && bp < 1 ? Math.min(1, bp * 6, (1 - bp) * 6) : 0;
  const flashL = !forwarded ? prog(t, B.outB, B.outB + 80) * (1 - prog(t, B.outB + 80, B.outB + 520)) : 0;
  const flashR = forwarded ? prog(t, B.outB - 80, B.outB) * (1 - prog(t, B.outB, B.outB + 460)) : 0;
  $('nodeL').style.borderColor = flashL > .05 ? 'var(--accent)' : 'var(--border)';
  $('nodeL').style.background = `color-mix(in srgb, var(--accent) ${Math.round(flashL * 22)}%, var(--panel))`;
  $('nodeR').style.borderColor = flashR > .05 ? 'var(--ok)' : 'var(--border)';
  $('nodeR').style.background = `color-mix(in srgb, var(--ok) ${Math.round(flashR * 22)}%, var(--panel))`;

  // ── counters, provider tally, log lines ──
  const done = k => endT >= 0 || k < i || (k === i && t >= B.outB);
  let scanned = 0, red = 0, blk = 0, rcv = 0;
  SCENES.forEach((s, k) => { if (done(k)) { scanned++; if (s.action === 'REDACT') red++; if (s.action === 'BLOCK') blk++; else rcv++; } });
  $('c-s').textContent = scanned; $('c-r').textContent = red; $('c-b').textContent = blk;
  const skipped = !forwarded && t >= B.outB && endT < 0;
  $('rcv').innerHTML = `received ${rcv}<br/>` + (skipped ? '<span style="color:var(--accent)">never sees this one</span>' : '&nbsp;');

  let html = '';
  SCENES.forEach((s, k) => {
    const lp = endT >= 0 || k < i ? 1 : k === i ? out3(prog(t, B.logA, B.logB)) : 0;
    if (lp <= 0) return;
    const c = COLOR[s.action];
    html += `<div class="line" style="top:${26 + k * 27}px; opacity:${lp}; transform: translateX(${(1 - lp) * -14}px);` +
      (k === i && endT < 0 ? `background: color-mix(in srgb, ${c} ${Math.round((1 - prog(t, B.logB, B.logB + 400)) * 14)}%, transparent);` : '') + `">` +
      `<span class="a" style="color:${c}">${s.log[0]}</span><span>${s.log[1]}</span>` +
      `<span style="color:${s.log[2] === '200' ? 'var(--ok)' : 'var(--accent)'}">${s.log[2]}</span><span style="color:var(--subtle)">${s.log[3]}</span></div>`;
  });
  $('lines').innerHTML = html;

  // ── end card ──
  const end = $('end');
  if (endT < 0) { end.style.display = 'none'; return; }
  end.style.display = 'flex';
  end.style.opacity = Math.min(prog(endT, 500, 850), 1 - prog(endT, END_MS - 280, END_MS));
  const lp = prog(endT, 800, 1050);
  $('endlogo').style.transform = `translateY(${lerp(-26, 0, in3(lp))}px) scale(${lerp(1.25, 1, in3(lp))})`;
  $('endlogo').style.opacity = Math.min(1, lp * 2);
  [['endh', 1050], ['endp', 1250], ['endu', 1400]].forEach(([id, a]) => {
    const p = out3(prog(endT, a, a + 420));
    $(id).style.opacity = p; $(id).style.transform = `translateY(${(1 - p) * 12}px)`;
  });
}
window.renderAt = render;

if (!new URLSearchParams(location.search).has('manual')) {
  const t0 = performance.now();
  const loop = () => { render(performance.now() - t0); requestAnimationFrame(loop); };
  loop();
} else {
  render(0);
}
</script>
</body>
</html>
